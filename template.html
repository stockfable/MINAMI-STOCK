    <style>

        body { background: #050505; min-height: 100vh; font-family: 'Outfit', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: white; margin: 30px 0 10px; font-family: 'Space Grotesk', sans-serif; text-align: center; font-size: 24px; }
        p.subtitle { color: #888; font-size: 14px; margin-bottom: 30px; text-align: center; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; width: 100%; max-width: 1400px; justify-items: center; }

        .tpl {
            width: 100%; max-width: 360px; aspect-ratio: 4/5; position: relative; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); container-type: inline-size; 
            display: flex; flex-direction: column; border-radius: 8px; background: #fff;
            transition: transform 0.3s;
        }
        .tpl:hover { transform: translateY(-5px); }
        
        .tpl-number {
            position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.8); color: #fff;
            padding: 4px 10px; font-size: 11px; border-radius: 4px; z-index: 100; font-weight: bold;
            backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2);
        }

        .img-box { width: 100%; flex: 1; overflow: hidden; position: relative; z-index: 1; background: #cbd5e1; }
        .img-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
