<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MINAMI Admin – Payments</title>
<style>
:root{--y:#ffc400;--red:#e5534b;--text:#f2f2f2;--muted:#9a9a9a;--line:#2a2a2a;--card:#111}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#000;color:var(--text)}
nav{background:#0a0a0a;border-bottom:1px solid var(--line);padding:12px 18px;font-weight:800;font-size:1.2rem}
nav span{color:var(--y)}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:1.3rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card b{color:var(--y)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--y);color:#000;text-decoration:none;display:inline-block}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
.small{color:var(--muted);font-size:.85rem}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<nav><span>MINAMI</span> Admin · Payments</nav>
<div class="wrap">
  <h1>Pending payments</h1>
  <p class="small" id="msg">Loading…</p>
  <div id="list"></div>
</div>
<script>
const FIREBASE_CONFIG = {            // same config as upscaler-pro.html
  apiKey: "PASTE_API_KEY",
  authDomain: "creoverse-stock.firebaseapp.com",
  projectId: "creoverse-stock",
  appId: "PASTE_APP_ID"
};
const ADMIN_EMAIL = "bk5969736@gmail.com";   // must match the email in your Firestore rules

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore();

auth.onAuthStateChanged(u => {
  if (!u) { $('msg').innerHTML = 'Please <a style="color:#ffc400" href="login.html">log in</a> with the admin account.'; return; }
  if (u.email !== ADMIN_EMAIL) { $('msg').textContent = 'Access denied for ' + u.email; return; }
  $('msg').textContent = 'Check each TrxID in your bKash/Nagad/Rocket app before approving.';
  db.collection('payments').where('status', '==', 'pending').onSnapshot(q => {
    if (q.empty) { $('list').innerHTML = '<div class="card small">No pending payments.</div>'; return; }
    $('list').innerHTML = q.docs.map(d => {
      const p = d.data();
      return `<div class="card"><div><b>৳${p.amount}</b> · ${esc(p.method)} · ${p.days} days</div>
        <div class="small">TrxID: <b>${esc(p.trxId)}</b> · From: ${esc(p.sender)}</div>
        <div class="small">${esc(p.email)}</div>
        <div class="row"><button class="btn" data-a="ok" data-id="${esc(d.id)}">Approve</button><button class="btn red" data-a="no" data-id="${esc(d.id)}">Reject</button></div></div>`;
    }).join('');
  }, e => { $('msg').textContent = 'Error: ' + e.message; });
});

$('list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  b.disabled = true;
  const ref = db.collection('payments').doc(b.dataset.id);
  try {
    if (b.dataset.a === 'no') { await ref.update({ status: 'rejected' }); return; }
    const p = (await ref.get()).data();
    const subRef = db.collection('subscriptions').doc(p.uid);
    const old = await subRef.get();
    const base = Math.max(Date.now(), old.exists ? +old.data().expiresAt || 0 : 0);
    const batch = db.batch();
    batch.set(subRef, { status: 'active', plan: p.planId, expiresAt: base + p.days * 864e5, email: p.email });
    batch.update(ref, { status: 'approved' });
    await batch.commit();
  } catch (err) { alert(err.message); b.disabled = false; }
});
</script>
</body>
</html>
