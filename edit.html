<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor - MINAMI STOCK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0d0f14;color:#e8e8f0;font-family:system-ui,Arial,sans-serif}
button,a{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-decoration:none}
#ed{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:4px;padding:0 8px;height:44px;flex:none;background:linear-gradient(90deg,#0d9488,#3b82f6 45%,#7c3aed);overflow-x:auto;scrollbar-width:none;font-size:12.5px;font-weight:600}
.top>*{flex:none;white-space:nowrap;padding:6px 8px;border-radius:7px}
.top .sp{flex:1;padding:0}
#nm{background:#ffffff26;border:0;color:#fff;width:112px;font-size:12.5px;outline:0}
#nm::placeholder{color:#ffffffaa}
#chip{background:#0d0f1488;border:1px solid #ffffff55}
#av{width:28px;height:28px;border-radius:50%;background:#0d0f14;display:grid;place-items:center;padding:0;font-size:12px}
.share{background:#fff;color:#4c1d95;font-weight:700}
#wrap{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0}
.zm{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:2px;background:#171a21ee;border:1px solid #ffffff22;border-radius:10px;padding:3px;z-index:3}.zm button{width:34px;height:34px;font-size:18px;border-radius:8px}.zm span{width:46px;text-align:center;font-size:12px}
.im{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.im img{position:absolute;max-width:none;pointer-events:none}
.el.sel{outline:var(--bw,2px) solid #8b5cf6}
.hd{right:calc(var(--hs,20px)/-2);bottom:calc(var(--hs,20px)/-2);width:var(--hs,20px);height:var(--hs,20px);border:var(--bw,2px) solid #fff}
.rh{position:absolute;left:50%;bottom:calc(var(--hs,20px)*-2.2);width:var(--hs,20px);height:var(--hs,20px);margin-left:calc(var(--hs,20px)/-2);border-radius:50%;background:#fff;border:var(--bw,2px) solid #8b5cf6;display:none}
.sel .rh{display:block}
#mb{display:none;position:absolute;z-index:3;background:#12141a;border:1px solid #ffffff2a;border-radius:10px;padding:2px}
#mb button{width:34px;height:32px;font-size:15px}
.tl{display:flex;gap:2px;overflow-x:auto;width:100%;scrollbar-width:none}
.tl button,.tl label{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:#c4c6d6;padding:4px 0;cursor:pointer}
.tl i{font-style:normal;font-size:17px;line-height:1;color:#e6e8f4}
.tp{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:13px}
.tp button{font-size:18px;padding:2px 10px}
.sl{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:10px}
.sl span{width:84px;flex:none}.sl input{flex:1}.sl b{width:32px;text-align:right;font-weight:400;color:#9a9ab0}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.fg button{background:#262a33;border-radius:10px;padding:6px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px;border:2px solid transparent}
.fg button.on{border-color:#8b5cf6}
.fg img{width:54px;height:54px;object-fit:cover;border-radius:6px}
.fg .sw{width:54px;height:54px;border-radius:8px}
.mr{display:flex;flex-direction:column}
.mr button{text-align:left;padding:11px 6px;font-size:13.5px;border-bottom:1px solid #ffffff12}
.mr .row2{display:flex;gap:6px}
.mr .row2 button{flex:1;text-align:center;background:#262a33;border-radius:8px;border:0;padding:10px 0}
#st{position:absolute;transform-origin:0 0;box-shadow:0 8px 40px #000a}
.el{position:absolute;user-select:none;touch-action:none;cursor:move}
.el.sel{outline:2px solid #8b5cf6}
#pn{display:none;flex:none;background:#12141a;border-top:1px solid #ffffff1a;padding:7px 10px;gap:8px;flex-wrap:wrap;align-items:center;max-height:30vh;overflow:auto}
#pn textarea,#pn select,#pn input[type=number]{background:#262a33;border:0;color:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
#pn textarea{width:100%}
.lb{font-size:12px;color:#9a9ab0;display:flex;gap:6px;align-items:center}
.ib{padding:7px 12px;border-radius:8px;background:#262a33;font-size:13px;white-space:nowrap}
.ib.p{background:#7c3aed}
.col>label{display:block;cursor:pointer}
#bar{display:flex;flex:none;background:#0d0f14;border-top:1px solid #ffffff14;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
#bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:#aeb0c0}
#bar i{font-style:normal;font-size:18px;line-height:1;color:#d6d8e6}
#bar button.on,#bar button.on i{color:#a78bfa}
#sheet{display:none;position:absolute;left:0;right:0;bottom:58px;max-height:46vh;overflow:auto;background:#171a21;border-top:1px solid #ffffff22;border-radius:14px 14px 0 0;padding:12px;z-index:6}
#side{display:none;position:absolute;right:10px;top:54px;width:215px;background:#171a21;border:1px solid #ffffff22;border-radius:12px;padding:12px;z-index:4}
.ex{display:flex;flex-direction:column;gap:10px;font-size:13px}
.ex select,#sheet input[type=number]{background:#262a33;border:0;color:#fff;border-radius:8px;padding:7px;font:inherit}
.ex label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex small,#sheet small{color:#8e91a3;font-size:11.5px;line-height:1.4}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.gr button{height:54px;border-radius:10px;background:#262a33;font-size:24px;border:1px solid #ffffff1a}
.col{display:flex;flex-direction:column;gap:8px}
.col>button,.col>label{text-align:left;padding:11px 12px;border-radius:10px;background:#262a33;font-size:14px}
#tt{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90%}
#tt.on{opacity:1}
@media(min-width:760px){#side{display:block}#wrap{margin-right:240px}}
.el.sel{z-index:5}
.mk{position:absolute;z-index:3;pointer-events:none;background:rgba(13,15,20,.92)}
.hd{position:absolute;width:var(--hs,20px);height:var(--hs,20px);border-radius:50%;background:#8b5cf6;border:var(--bw,2px) solid #fff;display:none;margin:0}
.hd::after{content:'';position:absolute;inset:calc(var(--hs,20px)*-.9)}
.hd[data-c=nw]{left:calc(var(--hs,20px)/-2);top:calc(var(--hs,20px)/-2);right:auto;bottom:auto}
.hd[data-c=ne]{right:calc(var(--hs,20px)/-2);top:calc(var(--hs,20px)/-2);left:auto;bottom:auto}
.hd[data-c=sw]{left:calc(var(--hs,20px)/-2);bottom:calc(var(--hs,20px)/-2);right:auto;top:auto}
.hd[data-c=se]{right:calc(var(--hs,20px)/-2);bottom:calc(var(--hs,20px)/-2);left:auto;top:auto}
.sel .hd{display:block}
.ex input[type=text],.ex textarea,.ex input[type=number]{background:#262a33;border:0;color:#fff;border-radius:8px;padding:7px;font:inherit;font-size:13px;width:58%}
.ex .px{display:flex;flex-direction:column;gap:8px}
.ex .px input{width:48%}
.ex .chips{display:flex;gap:6px;flex-wrap:wrap}
.ex .chk{justify-content:flex-start;font-size:12px}

/* Toggle Switch */
.switch { position: relative; display: inline-block; width: 34px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #262a33; -webkit-transition: .4s; transition: .4s; border-radius: 20px; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; -webkit-transition: .4s; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: #8b5cf6; }
input:checked + .slider:before { -webkit-transform: translateX(14px); -ms-transform: translateX(14px); transform: translateX(14px); }

/* =========================================
   Upscaler Modal CSS (UPDATED)
   ========================================= */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
.modal-overlay.active { display: flex; }
/* মডালের সাইজ বাড়ানো হয়েছে */
.modal-box { background: #1e1e24; border: 1px solid #3f3f46; border-radius: 16px; width: 100%; max-width: 520px; padding: 20px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; color: white; }
.close-btn { position: absolute; top: 15px; right: 15px; background: #27272a; border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; z-index: 10;}
.modal-box h2 { font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

/* প্রিভিউ বক্সের কালো জায়গা ফিক্স */
.up-preview-box { 
    width: 100%; 
    min-height: 150px; 
    background: transparent; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    overflow: hidden; 
    margin-bottom: 10px;
    border-radius: 12px;
} 
.up-preview-box img { 
    width: 100%; 
    height: auto; 
    max-height: 350px; 
    object-fit: contain; 
    display: none; 
    transition: filter 0.2s; 
    cursor: zoom-in; 
    border-radius: 12px;
    border: 1px solid #3f3f46; 
}
.up-preview-box .placeholder { color: #71717a; text-align: center; font-size: 14px; background: #121215; width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px dashed #3f3f46;}

.up-size-info { display: flex; justify-content: space-between; font-size: 12px; color: #a1a1aa; margin-bottom: 15px; background: #121215; padding: 8px; border-radius: 8px; }
.up-size-info span { font-weight: bold; color: #e4e4e7; }
.up-slider-group { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.up-slider-group label { font-size: 12px; color: #a1a1aa; width: 70px; }
.up-slider-group input[type="range"] { flex: 1; accent-color: #8b5cf6; }
.up-slider-group span { font-size: 12px; width: 35px; text-align: right; }
.scale-box { width: 40px; height: 40px; border: 1px solid #3f3f46; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; background: #121215; font-weight: 600; }
.up-input-group { margin-bottom: 12px; }
.up-input-group label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #a1a1aa; margin-bottom: 5px; }
.up-input-group input[type="text"], .up-input-group textarea, .up-input-group select { width: 100%; background: #121215; border: 1px solid #3f3f46; color: white; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; }
.up-btn-primary { width: 100%; background: #8b5cf6; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px;}
.up-btn-secondary { width: 100%; background: #27272a; color: white; border: 1px solid #3f3f46; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.up-btn-success { width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;}
.up-loader { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#up-file-input { display: none; }

/* Auto Gen Button */
.btn-magic { background: #8b5cf6; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 600; }
.btn-magic:hover { background: #7c3aed; }

/* Scrollbar for thumbnails */
#up-thumbnails::-webkit-scrollbar { height: 6px; }
#up-thumbnails::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

#zoomImgOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 99999; align-items: center; justify-content: center; }
#zoomImgOverlay img { max-width: 98vw; max-height: 95vh; object-fit: contain; border-radius: 8px; }
#zoomImgOverlay .close-zoom { position: absolute; top: 20px; right: 20px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; background: rgba(0,0,0,0.5); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
</style></head><body>

<div id="zoomImgOverlay" onclick="this.style.display='none'">
    <div class="close-zoom">&times;</div>
    <img id="zoomedImg" src="">
</div>

<div id="ed" style="display:flex">
 <header class="top">
  <a href="studio.html" title="Home">⌂</a>
  <button onclick="sheet('file')">File</button>
  <button onclick="sheet('resize')">Resize</button>
  <input id="nm" placeholder="Untitled Design">
  <button onclick="undo()">↶</button><button onclick="redo()">↷</button>
  <span class="sp"></span>
  <button id="chip" onclick="sheet('export')">300 DPI</button>
  <span id="av">👤</span>
  <button class="share" onclick="sheet('export')">Share</button>
 </header>
 <div id="wrap"><div id="st"></div><div id="mb"><button onclick="dup()" title="Duplicate">⧉</button><button onclick="del()" title="Delete">🗑</button><button onclick="tool('more')" title="More">⋯</button></div><div class="zm"><button onclick="zoomBy(.8)">−</button><span id="zl">100%</span><button onclick="zoomBy(1.25)">+</button><button onclick="zoomFit()">⤢</button></div></div>
 <div id="pn"></div>
 <div id="side"></div>
 <div id="sheet"></div>
 <nav id="bar">
  <button onclick="tab('templates')"><i>▤</i>Templates</button>
  <button data-k="elements" onclick="tab('elements')"><i>◇</i>Elements</button>
  <button data-k="text" onclick="tab('text')"><i>T</i>Text</button>
  <button data-k="bg" onclick="tab('bg')"><i>▦</i>Background</button>
  <button data-k="uploads" onclick="tab('uploads')"><i>⇪</i>Uploads</button>
  <button data-k="tools" onclick="tab('tools')"><i>✎</i>Tools</button>
  <button onclick="tab('projects')"><i>▭</i>Projects</button>
  <button onclick="tab('apps')"><i class="fa-solid fa-wand-magic-sparkles"></i>Apps</button>
 </nav>
</div>

<input type="file" id="fi" accept="image/*" multiple style="position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px">
<input type="file" id="fi2" accept="image/*" style="position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px">
<input type="file" id="fi3" accept="image/*" capture="user" style="position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px">
<input type="file" id="fi4" accept="image/*" style="position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px">
<div id="tt"></div>

<div class="modal-overlay" id="upscalerModal">
    <div class="modal-box">
        <button class="close-btn" onclick="closeUpscaler()">✕</button>
        <h2><i class="fa-solid fa-expand" style="color:#8b5cf6"></i> Photo Upscaler & Meta</h2>
        
        <div class="up-preview-box" id="upPreviewBox">
            <div class="placeholder" id="upPlaceholder">Upload images to start</div>
            <img id="upPreviewImg" alt="Preview" title="Click to zoom">
        </div>

        <!-- Thumbnails container -->
        <div id="up-thumbnails" style="display:none; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px;"></div>

        <div class="up-size-info" id="upSizeInfo" style="display:none;">
            <div>Original: <span id="upOrigSize">0x0</span></div>
            <div>Output: <span id="upOutSize">0x0</span> (<span id="upOutMP">0</span> MP)</div>
        </div>

        <input type="file" id="up-file-input" accept="image/*" multiple onchange="handleUpImages(event)">
        
        <button class="up-btn-secondary" id="upSelectBtn" onclick="document.getElementById('up-file-input').click()">
            <i class="fa-solid fa-plus"></i> Add Images (Max 100)
        </button>

        <div id="upMetaForm" style="display:none;">
            
            <div style="background:#121215; padding:10px; border-radius:8px; margin-bottom:15px;">
                <div style="font-size:12px; color:#8b5cf6; font-weight:600; margin-bottom:10px;">Image Adjustments</div>
                
                <!-- Brightness, Contrast, Shadow ডিফল্ট ভ্যালু সেট করা হয়েছে -->
                <div class="up-slider-group">
                    <label>Brightness</label>
                    <input type="range" id="upBrightness" min="0" max="200" value="110" oninput="updatePreviewStyle()">
                    <span id="upBrightnessVal">110%</span>
                </div>
                
                <div class="up-slider-group">
                    <label>Contrast</label>
                    <input type="range" id="upContrast" min="0" max="200" value="120" oninput="updatePreviewStyle()">
                    <span id="upContrastVal">120%</span>
                </div>
                
                <div class="up-slider-group">
                    <label>Shadow</label>
                    <input type="range" id="upShadow" min="0" max="50" value="10" oninput="updatePreviewStyle()">
                    <span id="upShadowVal">10px</span>
                </div>
            </div>

            <div style="background:#1a1625; padding:10px; border-radius:8px; margin-bottom:15px; border:1px solid #7c3aed;">
                <div style="font-size:12px; color:#a78bfa; font-weight:600; margin-bottom:10px;">File Size (MB) Booster</div>
                
                <div class="up-slider-group" style="margin-bottom:12px; align-items:center;">
                    <label style="width:60px; color:#e4e4e7; font-weight:600;">Scale</label>
                    <input type="range" id="upScale" min="1" max="4" step="0.1" value="2" oninput="updateScale()">
                    <div class="scale-box" id="upScaleVal">2x</div>
                </div>

                <div class="up-input-group" style="margin-bottom:8px;">
                    <label>Image Format</label>
                    <select id="upFormat">
                        <option value="jpeg">JPG (Smaller MB)</option>
                        <option value="png" selected>PNG (Huge MB, Lossless)</option>
                    </select>
                </div>
                
                <div class="up-slider-group">
                    <label style="width:90px; color:#e4e4e7;">Add Noise</label>
                    <input type="range" id="upNoise" min="0" max="50" value="0" oninput="document.getElementById('upNoiseVal').innerText=this.value">
                    <span id="upNoiseVal" style="color:#a78bfa;">0</span>
                </div>
            </div>

            <!-- Auto Gen Category List (Advanced) -->
            <div class="up-input-group">
                <label>Select Image Category (for Auto-Gen)</label>
                <select id="upCategory">
                    <option value="film">Film Texture / Grunge / Vintage</option>
                    <option value="abstract">Abstract / Gradient / Light Leaks</option>
                    <option value="nature">Nature / Landscapes</option>
                    <option value="business">Business / Office / Corporate</option>
                    <option value="food">Food & Drink</option>
                    <option value="technology">Technology / Futuristic</option>
                    <option value="lifestyle">People & Lifestyle</option>
                    <option value="travel">Travel & Architecture</option>
                    <option value="animals">Animals & Pets</option>
                </select>
            </div>

            <div class="up-input-group">
                <label>File Name (without extension)</label>
                <input type="text" id="upFileName" placeholder="Enter custom file name">
            </div>

            <div class="up-input-group">
                <label>
                    Adobe Stock Title 
                    <button class="btn-magic" onclick="autoFillMeta()"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto Gen</button>
                </label>
                <input type="text" id="upAdobeTitle" placeholder="e.g. Beautiful modern workspace">
            </div>
            
            <div class="up-input-group">
                <label>
                    Keywords (comma separated)
                    <div style="display:flex; gap:6px;">
                        <button class="btn-magic" onclick="autoFillMeta()"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto Gen</button>
                        <button class="btn-magic" style="background:#10b981;" onclick="bulkGenerateKeywords()"><i class="fa-solid fa-download"></i> Bulk Gen 100</button>
                    </div>
                </label>
                <textarea id="upAdobeKeywords" rows="4" placeholder="business, office, desk, laptop"></textarea>
            </div>
            
            <div class="up-input-group">
                <label>Download DPI (Adobe needs 300)</label>
                <select id="upDpi">
                    <option value="72">72 DPI (Web)</option>
                    <option value="150">150 DPI (Standard)</option>
                    <option value="300" selected>300 DPI (Print / Adobe Stock)</option>
                    <option value="600">600 DPI (High Res)</option>
                </select>
            </div>

            <!-- Crop Marks Toggle -->
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:10px; background:#121215; padding:10px; border-radius:8px;">
                <span style="color:#e4e4e7;">Add Crop Marks (Corners)</span>
                <label class="switch"><input type="checkbox" id="upCropMarks"><span class="slider"></span></label>
            </div>

            <button class="up-btn-primary" id="upProcessBtn" onclick="processUpscale(false)">
                <span id="upProcessText">Save & Download Current</span>
                <div class="up-loader" id="upBtnLoader"></div>
            </button>

function xmpStr(title,kw){const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 return '<?xpacket begin="\uFEFF" id="W5M0MpCehiHzreSzNTczkc9d"?><x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/">'
 +(title?'<dc:title><rdf:Alt><rdf:li xml:lang="x-default">'+x(title)+'</rdf:li></rdf:Alt></dc:title>':'')
 +(kw.length?'<dc:subject><rdf:Bag>'+kw.map(k=>'<rdf:li>'+x(k)+'</rdf:li>').join('')+'</rdf:Bag></dc:subject>':'')
 +'</rdf:Description></rdf:RDF></x:xmpmeta><?xpacket end="w"?>'}

 const ch=[pch('pHYs',pd)];if(meta){if(meta.title)ch.push(itxt('Title',meta.title));if(meta.kw.length)ch.push(itxt('Keywords',meta.kw.join(', ')));ch.push(itxt('XML:com.adobe.xmp',xmpStr(meta.title,meta.kw)))}
 const n=ch.reduce((a,c)=>a+c.length,0),o=new Uint8Array(u.length+n);o.set(u.subarray(0,33));let p=33;ch.forEach(c=>{o.set(c,p);p+=c.length});o.set(u.subarray(33),p);return o}

function jpgXmp(u,meta){const en=new TextEncoder(),h=en.encode('http://ns.adobe.com/xap/1.0/\0'),x=en.encode(xmpStr(meta.title,meta.kw)),len=h.length+x.length+2;if(len>65535)return u;

async function dl(){

 await Promise.all(D.els.filter(x=>x.t=='img').map(x=>{const m=im(x);return m.decode?m.decode().catch(()=>{}):0}));
 const cv=document.createElement('canvas');cv.width=W;cv.height=Hh;const x=cv.getContext('2d'),sx=W/D.w,sy=Hh/D.h;
 
 const originalBg = D.bg;
 if (D.transparent) D.bg = null;
 x.save();x.scale(1,sy/sx);draw(x,D,sx);x.restore();
 D.bg = originalBg;

 const jp=D.fmt=='jpg',type=jp?'image/jpeg':'image/png',title=((D.meta&&D.meta.title!=null?D.meta.title:$('nm').value)||'').trim(),kw=kws(),meta=(title||kw.length)?{title,kw}:null;
 let quality = parseFloat(D.quality) || 0.95;

 cv.toBlob(async b=>{if(!b)return toast('Could not export. Try a smaller pixel size');
  let u=new Uint8Array(await b.arrayBuffer());u=jp?jpgDpi(u,dpi):pngDpi(u,dpi,meta);if(jp&&meta)u=jpgXmp(u,meta);
  
  let finalFileName = (D.fileName !== undefined && D.fileName.trim() !== '') ? D.fileName.trim() : (D.name || $('nm').value || 'design');
  finalFileName = finalFileName.replace(/[\\/:*?"<>|]/g, '_');
  
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type}));a.download=(finalFileName+'.'+(jp?'jpg':'png'));a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Downloaded '+W+' x '+Hh+' px')},type,quality)}

        subjects: ["kitten playing", "dog running", "lion roaring", "bird flying", "puppy sleeping", "wildlife scene", "underwater fish", "forest animal"],
        details: ["with soft fur", "in natural habitat", "with wild nature", "with playful action"],
        usage: ["for pet care ads", "for wildlife magazines", "for animal blogs", "for veterinary clinics", "for nature conservation"],
        kwBase: ["animal", "pet", "wildlife", "cute", "wild", "nature", "dog", "cat", "kitten", "puppy", "lion", "bird", "playful", "fluffy", "portrait", "outdoors", "background", "animal photography", "wildlife photography", "pet background", "animal background", "fur", "paws", "zoo", "safari", "forest", "water", "fish", "insect", "reptile", "mammal", "predator", "prey", "habitat", "conservation", "endangered", "species", "fauna", "cute animal", "funny animal"]
    }
};

function generateRandomMeta() {
    const cat = document.getElementById('upCategory').value || 'film';
    const db = META_DB[cat] || META_DB['film'];
    const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];

    const color = Math.random() > 0.3 ? rand(db.colors) : ""; 
    const style = rand(db.styles);
    const subject = rand(db.subjects);
    const detail = Math.random() > 0.4 ? rand(db.details) : ""; 
    const usage = rand(db.usage);

    let titleParts = [color, style, subject, detail, usage].filter(p => p !== "");
    let title = titleParts.join(" ").replace(/\s+/g, ' ').trim();
    title = title.charAt(0).toUpperCase() + title.slice(1);

    const filename = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').substring(0, 50);

    // Build a large set of unique keywords
    let keywordsSet = new Set(db.kwBase); 
    
    // Add words from title
    const titleWords = title.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/);
    titleWords.forEach(w => {
        if(w.length > 2 && w !== "with" && w !== "and" && w !== "for" && w !== "the") keywordsSet.add(w);
    });

    // Convert to array and shuffle
    let keywordsArr = Array.from(keywordsSet).sort(() => 0.5 - Math.random());
    
    // Force exactly 35 to 40 keywords
    const targetKwCount = Math.floor(Math.random() * 6) + 35; // 35 to 40
    let finalKeywords = keywordsArr.slice(0, targetKwCount);
    
    // Fallback padding just in case (though kwBase is huge now)
    while (finalKeywords.length < targetKwCount) {
        finalKeywords.push(rand(["background", "texture", "abstract", "design", "art", "creative", "visual", "pattern", "modern", "digital"]));
    }
    
    // Final deduplication and enforce exact count
    finalKeywords = [...new Set(finalKeywords)];
    while (finalKeywords.length < targetKwCount) {
         finalKeywords.push(rand(["concept", "graphic", "element", "overlay", "effect", "style", "photo", "image"]));
    }

    const keywords = finalKeywords.slice(0, targetKwCount).join(', ');

    return { title, keywords, filename };
}

function autoFillMeta() {
    if (currentUpIndex === -1) return;
    const meta = generateRandomMeta();
    
    document.getElementById('upFileName').value = meta.filename;
    document.getElementById('upAdobeTitle').value = meta.title;
    document.getElementById('upAdobeKeywords').value = meta.keywords;
    
    upQueue[currentUpIndex].filename = meta.filename;
    upQueue[currentUpIndex].title = meta.title;
    upQueue[currentUpIndex].keywords = meta.keywords;
    
    toast('Auto-generated Title & 35-40 Keywords!');
}

// Bulk Keyword Generator (Saves 100 Sets at once)
function bulkGenerateKeywords() {
    const cat = document.getElementById('upCategory').value || 'film';
    let output = `--- Adobe Stock Bulk Keywords (Category: ${cat}) ---\n\n`;
    
    for (let i = 0; i < 100; i++) {
        const meta = generateRandomMeta();
        output += `Title: ${meta.title}\n`;
        output += `Keywords: ${meta.keywords}\n`;
        output += `--------------------------------------------------\n`;
    }
    
    const blob = new Blob([output], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Bulk_Keywords_${cat}_100Sets.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Downloaded 100 Keyword Sets (approx 4000 words)!');
}

function openUpscaler() {
    if(SH) sheet('');
    document.getElementById('upscalerModal').classList.add('active');
}
function closeUpscaler() {
    document.getElementById('upscalerModal').classList.remove('active');
}

function handleUpImages(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;

    if (upQueue.length + files.length > 100) {
        toast('You can upload a maximum of 100 images at a time.');
        return;
    }

    let loadedCount = 0;
    const startIndex = upQueue.length;

    files.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const meta = generateRandomMeta();
                
                upQueue.push({ 
                    file, 
                    src: e.target.result, 
                    imgObj: img, 
                    name: file.name,
                    title: meta.title,
                    keywords: meta.keywords,
                    filename: meta.filename
                });
                loadedCount++;

                if (loadedCount === files.length) {
                    renderUpThumbnails();
                    
                    document.getElementById('upPlaceholder').style.display = 'none';
                    document.getElementById('upMetaForm').style.display = 'block';
                    document.getElementById('upSizeInfo').style.display = 'flex';
                    document.getElementById('up-thumbnails').style.display = 'flex';
                    
                    if (currentUpIndex === -1 || startIndex === 0) {
                        selectUpImage(0);
                    }
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });

    event.target.value = '';
}

function renderUpThumbnails() {
    const container = document.getElementById('up-thumbnails');
    container.innerHTML = '';
    
    upQueue.forEach((item, index) => {
        const div = document.createElement('div');
        div.style.cssText = `position:relative; width:60px; height:60px; flex:none; border-radius:6px; cursor:pointer; border:2px solid ${index === currentUpIndex ? '#8b5cf6' : 'transparent'}; overflow:hidden;`;
        div.onclick = () => selectUpImage(index);
        
        const img = document.createElement('img');
        img.src = item.src;
        img.style.cssText = 'width:100%; height:100%; object-fit:cover;';
        
        // ডিলিট (X) বাটন
        const delBtn = document.createElement('button');
        delBtn.innerHTML = '&times;';
        delBtn.style.cssText = 'position:absolute; top:3px; right:3px; width:20px; height:20px; background:rgba(0,0,0,0.6); color:white; border:none; border-radius:50%; font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10; padding:0; line-height:1; transition:0.2s;';
        
        delBtn.onmouseover = () => delBtn.style.background = '#ef4444';
        delBtn.onmouseout = () => delBtn.style.background = 'rgba(0,0,0,0.6)';
        
        delBtn.onclick = (e) => {
            e.stopPropagation(); 
            removeUpImage(index);
        };
        
        div.appendChild(img);
        div.appendChild(delBtn);
        container.appendChild(div);
    });
}

function removeUpImage(index) {
    upQueue.splice(index, 1);
    
    if (upQueue.length === 0) {
        currentUpIndex = -1;
        document.getElementById('up-thumbnails').style.display = 'none';
        document.getElementById('upMetaForm').style.display = 'none';
        document.getElementById('upSizeInfo').style.display = 'none';
        
        const img = document.getElementById('upPreviewImg');
        img.style.display = 'none';
        img.src = '';
        document.getElementById('upPlaceholder').style.display = 'block';
    } else {
        if (currentUpIndex >= upQueue.length) {
            currentUpIndex = upQueue.length - 1;
        } else if (currentUpIndex > index) {
            currentUpIndex--;
        }
        selectUpImage(currentUpIndex);
    }
    renderUpThumbnails();
}

function selectUpImage(index) {
    if (index < 0 || index >= upQueue.length) return;
    currentUpIndex = index;
    
    const item = upQueue[index];
    const img = document.getElementById('upPreviewImg');
    
    img.src = item.src;
    img.style.display = 'block';
    
    document.getElementById('upOrigSize').innerText = `${item.imgObj.naturalWidth}x${item.imgObj.naturalHeight}`;
    document.getElementById('upFileName').value = item.filename || item.name.substring(0, item.name.lastIndexOf('.'));
    
    document.getElementById('upAdobeTitle').value = item.title || '';
    document.getElementById('upAdobeKeywords').value = item.keywords || '';
    
    renderUpThumbnails(); 
    updateScale();
    updatePreviewStyle();
}

function updateScale() {
    const img = document.getElementById('upPreviewImg');
    const scale = parseFloat(document.getElementById('upScale').value);
    document.getElementById('upScaleVal').innerText = scale.toFixed(1) + 'x';
    
    if (img.naturalWidth) {
        let upTargetW = Math.round(img.naturalWidth * scale);
        let upTargetH = Math.round(img.naturalHeight * scale);
        
        const maxSize = 8000;
        if (upTargetW > maxSize || upTargetH > maxSize) {
            const ratio = Math.min(maxSize / upTargetW, maxSize / upTargetH);
            upTargetW = Math.round(upTargetW * ratio);
            upTargetH = Math.round(upTargetH * ratio);
        }

        const mp = ((upTargetW * upTargetH) / 1000000).toFixed(1);
        document.getElementById('upOutSize').innerText = `${upTargetW}x${upTargetH}`;
        document.getElementById('upOutMP').innerText = mp;
    }
}

document.getElementById('upPreviewImg').onclick = function() {
    if(this.src && this.style.display !== 'none') {
        document.getElementById('zoomedImg').src = this.src;
        document.getElementById('zoomImgOverlay').style.display = 'flex';
    }
}

function updatePreviewStyle() {
    const img = document.getElementById('upPreviewImg');
    const b = document.getElementById('upBrightness').value;
    const c = document.getElementById('upContrast').value;
    const s = document.getElementById('upShadow').value;
    
    document.getElementById('upBrightnessVal').innerText = b + '%';
    document.getElementById('upContrastVal').innerText = c + '%';
    document.getElementById('upShadowVal').innerText = s + 'px';
    
    if(img.style.display !== 'none') {
        img.style.filter = `brightness(${b}%) contrast(${c}%) drop-shadow(0 0 ${s}px rgba(0,0,0,0.8))`;
    }
}

function processUpscale(isAll = false) {
    if (currentUpIndex === -1 || upQueue.length === 0) return;

    const btn = document.getElementById('upProcessBtn');
    const btnText = document.getElementById('upProcessText');
    const loader = document.getElementById('upBtnLoader');
    
    const btnAll = document.getElementById('upDownloadAllBtn');
    const btnAllText = document.getElementById('upDownloadAllText');
    const loaderAll = document.getElementById('upBtnAllLoader');

    btn.disabled = true;
    btnAll.disabled = true;
    if (isAll) {
        btnAllText.style.display = 'none';
        loaderAll.style.display = 'block';
    } else {
        btnText.style.display = 'none';
        loader.style.display = 'block';
    }

    const brightness = document.getElementById('upBrightness').value;
    const contrast = document.getElementById('upContrast').value;
    const shadow = document.getElementById('upShadow').value;
    const dpi = parseInt(document.getElementById('upDpi').value);
    const addCropMarks = document.getElementById('upCropMarks').checked;
    
    const format = document.getElementById('upFormat').value;
    const noiseAmount = parseInt(document.getElementById('upNoise').value);
    const mimeType = format === 'png' ? 'image/png' : 'image/jpeg';
    const fileExt = format === 'png' ? 'png' : 'jpg';
    const scaleVal = parseFloat(document.getElementById('upScale').value);

    upQueue[currentUpIndex].title = document.getElementById('upAdobeTitle').value.trim();
    upQueue[currentUpIndex].keywords = document.getElementById('upAdobeKeywords').value;
    upQueue[currentUpIndex].filename = document.getElementById('upFileName').value.trim();

    let indicesToProcess = isAll ? upQueue.map((_, i) => i) : [currentUpIndex];

    let processedCount = 0;
    let totalToProcess = indicesToProcess.length;

    async function processNext() {
        if (processedCount >= totalToProcess) {
            btn.disabled = false;
            btnAll.disabled = false;
            btnText.style.display = 'block';
            btnAllText.style.display = 'block';
            loader.style.display = 'none';
            loaderAll.style.display = 'none';
            toast(`Successfully downloaded ${totalToProcess} image(s)!`);
            return;
        }

        const idx = indicesToProcess[processedCount];
        const item = upQueue[idx];
        const img = item.imgObj;
        
        if(isAll) btnAllText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing ${processedCount + 1}/${totalToProcess}...`;

        let targetW = Math.round(img.naturalWidth * scaleVal);
        let targetH = Math.round(img.naturalHeight * scaleVal);
        const maxSize = 8000;
        if (targetW > maxSize || targetH > maxSize) {
            const ratio = Math.min(maxSize / targetW, maxSize / targetH);
            targetW = Math.round(targetW * ratio);
            targetH = Math.round(targetH * ratio);
        }

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = targetW;
        canvas.height = targetH;
        
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
        
        if(shadow > 0) {
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = shadow;
            ctx.drawImage(img, 0, 0, targetW, targetH);
        } else {
            ctx.drawImage(img, 0, 0, targetW, targetH);
        }
        
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;

        if (noiseAmount > 0) {
            const imgData = ctx.getImageData(0, 0, targetW, targetH);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * noiseAmount;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
            }
            ctx.putImageData(imgData, 0, 0);
        }

        if (addCropMarks) {
            const markLength = Math.max(targetW, targetH) * 0.05; 
            const lineWidth = Math.max(2, Math.max(targetW, targetH) * 0.002);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = lineWidth;
            
            ctx.beginPath(); ctx.moveTo(0, markLength); ctx.lineTo(0, 0); ctx.lineTo(markLength, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(targetW, markLength); ctx.lineTo(targetW, 0); ctx.lineTo(targetW - markLength, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, targetH - markLength); ctx.lineTo(0, targetH); ctx.lineTo(markLength, targetH); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(targetW, targetH - markLength); ctx.lineTo(targetW, targetH); ctx.lineTo(targetW - markLength, targetH); ctx.stroke();
        }

        const quality = format === 'png' ? 1.0 : 0.98; 

        canvas.toBlob(async (blob) => {
            if (blob) {
                let uint8 = new Uint8Array(await blob.arrayBuffer());
                
                const kw = item.keywords.split(/[,;\n]+/).map(k => k.trim()).filter(Boolean);
                const metaObj = (item.title || kw.length) ? { title: item.title, kw: kw } : null;
                
                if (format === 'png') {
                    uint8 = pngDpi(uint8, dpi, metaObj);
                } else {
                    uint8 = jpgDpi(uint8, dpi); 
                    if (metaObj) uint8 = jpgXmp(uint8, metaObj); 
                }
                
                const url = URL.createObjectURL(new Blob([uint8], { type: mimeType }));
                const a = document.createElement('a');
                a.href = url;
                
                let customName = item.filename || item.name.substring(0, item.name.lastIndexOf('.'));
                customName = customName.replace(/[\\/:*?"<>|]/g, '-'); 

                a.download = `${customName}.${fileExt}`;
                
                document.body.appendChild(a);
                a.click(); 
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                processedCount++;
                
                if (isAll) {
                    setTimeout(processNext, 1000);
                } else {
                    btn.disabled = false;
                    btnText.style.display = 'block';
                    loader.style.display = 'none';
                    btnAll.disabled = false;
                    toast(`Saved: ${targetW}x${targetH}`);
                    if (currentUpIndex < upQueue.length - 1) selectUpImage(currentUpIndex + 1);
                }
            } else {
                toast('Error processing image');
                btn.disabled = false; btnAll.disabled = false;
                btnText.style.display = 'block'; btnAllText.style.display = 'block';
                loader.style.display = 'none'; loaderAll.style.display = 'none';
            }
        }, mimeType, quality);
    }

    processNext();
}
