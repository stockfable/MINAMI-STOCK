<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0d0f14;color:#e8e8f0;font-family:system-ui,Arial,sans-serif}
button,a{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-decoration:none}
#ed{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:4px;padding:0 8px;height:44px;flex:none;background:linear-gradient(90deg,#0d9488,#3b82f6 45%,#7c3aed);overflow-x:auto;scrollbar-width:none;font-size:12.5px;font-weight:600}
.top>*{flex:none;white-space:nowrap;padding:6px 8px;border-radius:7px}
.top .sp{flex:1;padding:0}
#nm{background:#ffffff26;border:0;color:#fff;width:112px;font-size:12.5px;outline:0}
#nm::placeholder{color:#ffffffaa}
#chip{background:#0d0f1488;border:1px solid #ffffff55}
#av{width:28px;height:28px;border-radius:50%;background:#0d0f14;display:grid;place-items:center;padding:0;font-size:12px}
.share{background:#fff;color:#4c1d95;font-weight:700}
#wrap{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0}
.zm{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:2px;background:#171a21ee;border:1px solid #ffffff22;border-radius:10px;padding:3px;z-index:3}.zm button{width:34px;height:34px;font-size:18px;border-radius:8px}.zm span{width:46px;text-align:center;font-size:12px}
.im{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.im img{position:absolute;max-width:none;pointer-events:none}
.el.sel{outline:var(--bw,2px) solid #8b5cf6}
.hd{right:calc(var(--hs,20px)/-2);bottom:calc(var(--hs,20px)/-2);width:var(--hs,20px);height:var(--hs,20px);border:var(--bw,2px) solid #fff}
.rh{position:absolute;left:50%;bottom:calc(var(--hs,20px)*-2.2);width:var(--hs,20px);height:var(--hs,20px);margin-left:calc(var(--hs,20px)/-2);border-radius:50%;background:#fff;border:var(--bw,2px) solid #8b5cf6;display:none}
.sel .rh{display:block}
#mb{display:none;position:absolute;z-index:3;background:#12141a;border:1px solid #ffffff2a;border-radius:10px;padding:2px}
#mb button{width:34px;height:32px;font-size:15px}
.tl{display:flex;gap:2px;overflow-x:auto;width:100%;scrollbar-width:none}
.tl button,.tl label{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:#c4c6d6;padding:4px 0;cursor:pointer}
.tl i{font-style:normal;font-size:17px;line-height:1;color:#e6e8f4}
.tp{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:13px}
.tp button{font-size:18px;padding:2px 10px}
.sl{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:10px}
.sl span{width:84px;flex:none}.sl input{flex:1}.sl b{width:32px;text-align:right;font-weight:400;color:#9a9ab0}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.fg button{background:#262a33;border-radius:10px;padding:6px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px;border:2px solid transparent}
.fg button.on{border-color:#8b5cf6}
.fg img{width:54px;height:54px;object-fit:cover;border-radius:6px}
.fg .sw{width:54px;height:54px;border-radius:8px}
.mr{display:flex;flex-direction:column}
.mr button{text-align:left;padding:11px 6px;font-size:13.5px;border-bottom:1px solid #ffffff12}
.mr .row2{display:flex;gap:6px}
.mr .row2 button{flex:1;text-align:center;background:#262a33;border-radius:8px;border:0;padding:10px 0}
#st{position:absolute;transform-origin:0 0;box-shadow:0 8px 40px #000a}
.el{position:absolute;user-select:none;touch-action:none;cursor:move}
.el.sel{outline:2px solid #8b5cf6}
.hd{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;border-radius:50%;background:#8b5cf6;border:2px solid #fff;display:none}
.sel .hd{display:block}
#pn{display:none;flex:none;background:#12141a;border-top:1px solid #ffffff1a;padding:7px 10px;gap:8px;flex-wrap:wrap;align-items:center;max-height:30vh;overflow:auto}
#pn textarea,#pn select,#pn input[type=number]{background:#262a33;border:0;color:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
#pn textarea{width:100%}
.lb{font-size:12px;color:#9a9ab0;display:flex;gap:6px;align-items:center}
.ib{padding:7px 12px;border-radius:8px;background:#262a33;font-size:13px;white-space:nowrap}
.ib.p{background:#7c3aed}
.col>label{display:block;cursor:pointer}
#bar{display:flex;flex:none;background:#0d0f14;border-top:1px solid #ffffff14;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
#bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:#aeb0c0}
#bar i{font-style:normal;font-size:18px;line-height:1;color:#d6d8e6}
#bar button.on,#bar button.on i{color:#a78bfa}
#sheet{display:none;position:absolute;left:0;right:0;bottom:58px;max-height:46vh;overflow:auto;background:#171a21;border-top:1px solid #ffffff22;border-radius:14px 14px 0 0;padding:12px;z-index:6}
#side{display:none;position:absolute;right:10px;top:54px;width:215px;background:#171a21;border:1px solid #ffffff22;border-radius:12px;padding:12px;z-index:4}
.ex{display:flex;flex-direction:column;gap:10px;font-size:13px}
.ex select,#sheet input[type=number]{background:#262a33;border:0;color:#fff;border-radius:8px;padding:7px;font:inherit}
.ex label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex small,#sheet small{color:#8e91a3;font-size:11.5px;line-height:1.4}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.gr button{height:54px;border-radius:10px;background:#262a33;font-size:24px;border:1px solid #ffffff1a}
.col{display:flex;flex-direction:column;gap:8px}
.col>button,.col>label{text-align:left;padding:11px 12px;border-radius:10px;background:#262a33;font-size:14px}
#tt{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90%}
#tt.on{opacity:1}
@media(min-width:760px){#side{display:block}#wrap{margin-right:240px}}
.el.sel{z-index:5}
.mk{position:absolute;z-index:3;pointer-events:none;background:rgba(13,15,20,.92)}
.hd{position:absolute;width:var(--hs,20px);height:var(--hs,20px);border-radius:50%;background:#8b5cf6;border:var(--bw,2px) solid #fff;display:none;margin:0}
.hd::after{content:'';position:absolute;inset:calc(var(--hs,20px)*-.9)}
.hd[data-c=nw]{left:calc(var(--hs,20px)/-2);top:calc(var(--hs,20px)/-2);right:auto;bottom:auto}
.hd[data-c=ne]{right:calc(var(--hs,20px)/-2);top:calc(var(--hs,20px)/-2);left:auto;bottom:auto}
.hd[data-c=sw]{left:calc(var(--hs,20px)/-2);bottom:calc(var(--hs,20px)/-2);right:auto;top:auto}
.hd[data-c=se]{right:calc(var(--hs,20px)/-2);bottom:calc(var(--hs,20px)/-2);left:auto;top:auto}
.sel .hd{display:block}
.ex input[type=text],.ex textarea,.ex input[type=number]{background:#262a33;border:0;color:#fff;border-radius:8px;padding:7px;font:inherit;font-size:13px;width:58%}
.ex .px{display:flex;flex-direction:column;gap:8px}
.ex .px input{width:48%}
.ex .chips{display:flex;gap:6px;flex-wrap:wrap}
.ex .chk{justify-content:flex-start;font-size:12px}

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }

.modal-box { background: #1e1e24; border: 1px solid #3f3f46; border-radius: 16px; width: 100%; max-width: 450px; padding: 20px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; color: white; }
.close-btn { position: absolute; top: 15px; right: 15px; background: #27272a; border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }

.up-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; transition: filter 0.2s; cursor: zoom-in; }

.up-size-info { display: flex; justify-content: space-between; font-size: 12px; color: #a1a1aa; margin-bottom: 15px; background: #121215; padding: 8px; border-radius: 8px; }
.up-size-info span { font-weight: bold; color: #e4e4e7; }

/* Sliders */
.up-slider-group { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.up-slider-group label { font-size: 12px; color: #a1a1aa; width: 70px; }
.up-slider-group input[type="range"] { flex: 1; accent-color: #8b5cf6; }
.up-slider-group span { font-size: 12px; width: 35px; text-align: right; }

.up-input-group { margin-bottom: 12px; }
.up-input-group label { display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 5px; }
.up-input-group input[type="text"], .up-input-group textarea, .up-input-group select { width: 100%; background: #121215; border: 1px solid #3f3f46; color: white; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; }
.up-btn-primary { width: 100%; background: #8b5cf6; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px;}
.up-btn-secondary { width: 100%; background: #27272a; color: white; border: 1px solid #3f3f46; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.up-loader { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#up-file-input { display: none; }

/* =========================================

#zoomImgOverlay {

    width: 50px; height: 50px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center;
}

<!-- =========================================
     Upscaler Modal HTML
     ========================================= -->
<div class="modal-overlay" id="upscalerModal">
    <div class="modal-box">
        <button class="close-btn" onclick="closeUpscaler()">✕</button>
        <h2><i class="fa-solid fa-expand" style="color:#8b5cf6"></i> Photo Upscaler & Meta</h2>
        
        <div class="up-preview-box" id="upPreviewBox">
            <div class="placeholder" id="upPlaceholder">
                Upload an image to upscale
            </div>
            <img id="upPreviewImg" alt="Preview" title="Click to zoom">
        </div>

        <div class="up-size-info" id="upSizeInfo" style="display:none;">
            <div>Original: <span id="upOrigSize">0x0</span></div>
            <div>Output: <span id="upOutSize">0x0</span> (<span id="upOutMP">0</span> MP)</div>
        </div>

        <input type="file" id="up-file-input" accept="image/*" onchange="handleUpImage(event)">
        
        <button class="up-btn-secondary" id="upSelectBtn" onclick="document.getElementById('up-file-input').click()">
            <i class="fa-solid fa-plus"></i> Select Image
        </button>

        <div id="upMetaForm" style="display:none;">
            
            <!-- Image Adjustments -->
            <div style="background:#121215; padding:10px; border-radius:8px; margin-bottom:15px;">
                <div style="font-size:12px; color:#8b5cf6; font-weight:600; margin-bottom:10px;">Image Adjustments</div>
                
                <div class="up-slider-group">
                    <label>Brightness</label>
                    <input type="range" id="upBrightness" min="0" max="200" value="100" oninput="updatePreviewStyle()">
                    <span id="upBrightnessVal">100%</span>
                </div>
                
                <div class="up-slider-group">
                    <label>Contrast</label>
                    <input type="range" id="upContrast" min="0" max="200" value="100" oninput="updatePreviewStyle()">
                    <span id="upContrastVal">100%</span>
                </div>
                
                <div class="up-slider-group">
                    <label>Shadow</label>
                    <input type="range" id="upShadow" min="0" max="50" value="0" oninput="updatePreviewStyle()">
                    <span id="upShadowVal">0px</span>
                </div>
            </div>

            <!-- File Size Booster Section -->
            <div style="background:#1a1625; padding:10px; border-radius:8px; margin-bottom:15px; border:1px solid #7c3aed;">
                <div style="font-size:12px; color:#a78bfa; font-weight:600; margin-bottom:10px;">File Size (MB) Booster</div>
                
                <div class="up-input-group" style="margin-bottom:8px;">
                    <label>Image Format</label>
                    <select id="upFormat">
                        <option value="jpeg">JPG (Smaller MB)</option>
                        <option value="png" selected>PNG (Huge MB, Lossless)</option>
                    </select>
                </div>
                
                <div class="up-slider-group">
                    <label style="width:90px; color:#e4e4e7;">Add Noise</label>
                    <input type="range" id="upNoise" min="0" max="50" value="0" oninput="document.getElementById('upNoiseVal').innerText=this.value">
                    <span id="upNoiseVal" style="color:#a78bfa;">0</span>
                </div>
                <small style="color:#8e91a3; font-size:10px; display:block; margin-top:5px;">Higher noise = drastically bigger MB size.</small>
            </div>

            <div class="up-input-group">
                <label>Adobe Stock Title</label>
                <input type="text" id="upAdobeTitle" placeholder="e.g. Beautiful modern workspace">
            </div>
            <div class="up-input-group">
                <label>Keywords (comma separated)</label>
                <textarea id="upAdobeKeywords" rows="2" placeholder="business, office, desk, laptop"></textarea>
            </div>
            
            <div class="up-input-group">
                <label>Download DPI (Adobe needs 300)</label>
                <select id="upDpi">
                    <option value="72">72 DPI (Web)</option>
                    <option value="150">150 DPI (Standard)</option>
                    <option value="300" selected>300 DPI (Print / Adobe Stock)</option>
                    <option value="600">600 DPI (High Res)</option>
                </select>
            </div>

            <button class="up-btn-primary" id="upProcessBtn" onclick="processUpscale()">
                <span id="upProcessText">Upscale & Download Image</span>
                <div class="up-loader" id="upBtnLoader"></div>
            </button>

            <!-- আলাদা মেটাডেটা ডাউনলোড বাটন -->
            <button class="up-btn-secondary" onclick="downloadMeta()" style="margin-top:10px; font-size:12px; padding:8px;">
                <i class="fa-solid fa-file-lines"></i> Download Metadata (.txt)
            </button>
            <p style="font-size:11px; color:#71717a; margin-top:10px; text-align:center;">Image will download first. Tap above for Title/Keywords file.</p>
        </div>
    </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const rep=(k,v)=>k[0]=='_'?undefined:v;
function toast(m){const t=$('tt');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
const TX=(x,y,w,h,txt,fs,col,b,al)=>({t:'text',x,y,w,h,txt,fs,col,b,al,ff:'Arial'});
const RC=(x,y,w,h,fill,t)=>({t:t||'rect',x,y,w,h,fill});
const PO=(x,y,w,h,fill,pts)=>({t:'poly',x,y,w,h,fill,pts});
let user=null,db=null,began=0;
const rot=(c,e,f)=>{c.save();if(e.rot){const x=e.x+e.w/2,y=e.y+e.h/2;c.translate(x,y);c.rotate(e.rot*Math.PI/180);c.translate(-x,-y)}f();c.restore()};
function wrapT(c,t,w){const o=[];t.split('\n').forEach(p=>{let l='';p.split(' ').forEach(wd=>{const s=l?l+' '+wd:wd;if(c.measureText(s).width>w&&l){o.push(l);l=wd}else l=s});o.push(l)});return o}
const im=e=>e._i||(e._i=Object.assign(new Image(),{src:e.src}));
function thumb(d,box){const s=Math.min(box/d.w,box/d.h),c=document.createElement('canvas');c.width=Math.max(1,Math.round(d.w*s));c.height=Math.max(1,Math.round(d.h*s));draw(c.getContext('2d'),d,s);return c}

/* ---- editor ---- */
let D,sel=null,H=[],hi=-1,S=1,L0=0,T0=0,dr=null;
const st=$('st'),E=()=>sel!=null?D.els[sel]:null;
function pushH(){H=H.slice(0,hi+1);H.push(JSON.stringify(D,rep));hi=H.length-1}
function undo(){if(hi>0){D=JSON.parse(H[--hi]);sel=null;rs();pn()}}
function redo(){if(hi<H.length-1){D=JSON.parse(H[++hi]);sel=null;rs();pn()}}
function openD(d){try{const u=JSON.parse(localStorage.getItem('ms_fu')||'[]').filter(x=>x!=d.cat);u.unshift(d.cat);localStorage.setItem('ms_fu',JSON.stringify(u.slice(0,6)))}catch(e){}D=JSON.parse(JSON.stringify(d,rep));$('nm').value=D.name||'';sel=null;H=[];hi=-1;pushH();$('home').style.display='none';$('ed').style.display='flex';rs();pn()}
function back(){if(confirm('Save before leaving?'))save();$('ed').style.display='none';$('home').style.display='block';loadList()}
function ps(n,e){const s=n.style;s.left=e.x+'px';s.top=e.y+'px';s.width=e.w+'px';s.height=e.h+'px';s.transform=e.rot?'rotate('+e.rot+'deg)':'';

/* metadata writers (PNG iTXt + pHYs, JPEG JFIF + XMP) */
function pch(t,d){const o=new Uint8Array(12+d.length),v=new DataView(o.buffer);v.setUint32(0,d.length);for(let i=0;i<4;i++)o[4+i]=t.charCodeAt(i);o.set(d,8);v.setUint32(8+d.length,crc32(o.subarray(4,8+d.length)));return o}
function itxt(k,t){const en=new TextEncoder(),kb=en.encode(k),tb=en.encode(t),d=new Uint8Array(kb.length+5+tb.length);d.set(kb,0);d.set(tb,kb.length+5);return pch('iTXt',d)}
function xmpStr(title,kw){const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 return '<?xpacket begin="\uFEFF" id="W5M0MpCehiHzreSzNTczkc9d"?><x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/">'
 +(title?'<dc:title><rdf:Alt><rdf:li xml:lang="x-default">'+x(title)+'</rdf:li></rdf:Alt></dc:title>':'')
 +(kw.length?'<dc:subject><rdf:Bag>'+kw.map(k=>'<rdf:li>'+x(k)+'</rdf:li>').join('')+'</rdf:Bag></dc:subject>':'')
 +'</rdf:Description></rdf:RDF></x:xmpmeta><?xpacket end="w"?>'}
function pngDpi(u,dpi,meta){const m=Math.round(dpi/0.0254),pd=new Uint8Array(9),v=new DataView(pd.buffer);v.setUint32(0,m);v.setUint32(4,m);pd[8]=1;
 const ch=[pch('pHYs',pd)];if(meta){if(meta.title)ch.push(itxt('Title',meta.title));if(meta.kw.length)ch.push(itxt('Keywords',meta.kw.join(', ')));ch.push(itxt('XML:com.adobe.xmp',xmpStr(meta.title,meta.kw)))}
 const n=ch.reduce((a,c)=>a+c.length,0),o=new Uint8Array(u.length+n);o.set(u.subarray(0,33));let p=33;ch.forEach(c=>{o.set(c,p);p+=c.length});o.set(u.subarray(33),p);return o}
function jpgXmp(u,meta){const en=new TextEncoder(),h=en.encode('http://ns.adobe.com/xap/1.0/\0'),x=en.encode(xmpStr(meta.title,meta.kw)),len=h.length+x.length+2;if(len>65535)return u;
 const seg=new Uint8Array(len+2);seg[0]=255;seg[1]=225;seg[2]=len>>8;seg[3]=len&255;seg.set(h,4);seg.set(x,4+h.length);const off=4+((u[4]<<8)|u[5]),o=new Uint8Array(u.length+seg.length);o.set(u.subarray(0,off));o.set(seg,off);o.set(u.subarray(off),off+seg.length);return o}

/* =========================================
   Apps Modal (Upscaler) Logic
   ========================================= */
let upFile = null;
let upTargetW = 0, upTargetH = 0;

function openUpscaler() {
    if(SH) sheet('');
    document.getElementById('upscalerModal').classList.add('active');
}
function closeUpscaler() {
    document.getElementById('upscalerModal').classList.remove('active');
}

function handleUpImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    upFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = document.getElementById('upPreviewImg');
        
        img.onload = () => {
            img.style.display = 'block';
            document.getElementById('upPlaceholder').style.display = 'none';
            document.getElementById('upSelectBtn').style.display = 'none';
            document.getElementById('upMetaForm').style.display = 'block';
            document.getElementById('upSizeInfo').style.display = 'flex';

            const origW = img.naturalWidth;
            const origH = img.naturalHeight;
            document.getElementById('upOrigSize').innerText = `${origW}x${origH}`;

            const minPixels = 4000000; // 4MP minimum
            let currPixels = origW * origH;
            let scale = 1;

            if (currPixels < minPixels) {
                scale = Math.sqrt(minPixels / currPixels);
            } else {
                scale = 2; 
            }

            upTargetW = Math.round(origW * scale);
            upTargetH = Math.round(origH * scale);

            const maxSize = 8000; 
            if (upTargetW > maxSize || upTargetH > maxSize) {
                const ratio = Math.min(maxSize / upTargetW, maxSize / upTargetH);
                upTargetW = Math.round(upTargetW * ratio);
                upTargetH = Math.round(upTargetH * ratio);
            }

            const mp = ((upTargetW * upTargetH) / 1000000).toFixed(1);
            document.getElementById('upOutSize').innerText = `${upTargetW}x${upTargetH}`;
            document.getElementById('upOutMP').innerText = mp;
            
            updatePreviewStyle();
        };
        
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

document.getElementById('upPreviewImg').onclick = function() {
    if(this.src && this.style.display !== 'none') {
        document.getElementById('zoomedImg').src = this.src;
        document.getElementById('zoomImgOverlay').style.display = 'flex';
    }
}

function updatePreviewStyle() {
    const img = document.getElementById('upPreviewImg');
    const b = document.getElementById('upBrightness').value;
    const c = document.getElementById('upContrast').value;
    const s = document.getElementById('upShadow').value;
    
    document.getElementById('upBrightnessVal').innerText = b + '%';
    document.getElementById('upContrastVal').innerText = c + '%';
    document.getElementById('upShadowVal').innerText = s + 'px';
    
    if(img.style.display !== 'none') {
        img.style.filter = `brightness(${b}%) contrast(${c}%) drop-shadow(0 0 ${s}px rgba(0,0,0,0.8))`;
    }
}

// Only Download Image
function processUpscale() {
    if (!upFile) return;

    const btn = document.getElementById('upProcessBtn');
    const btnText = document.getElementById('upProcessText');
    const loader = document.getElementById('upBtnLoader');
    const img = document.getElementById('upPreviewImg');

    btn.disabled = true;
    btnText.style.display = 'none';
    loader.style.display = 'block';

    const brightness = document.getElementById('upBrightness').value;
    const contrast = document.getElementById('upContrast').value;
    const shadow = document.getElementById('upShadow').value;
    const dpi = parseInt(document.getElementById('upDpi').value);
    
    const format = document.getElementById('upFormat').value;
    const noiseAmount = parseInt(document.getElementById('upNoise').value);
    const mimeType = format === 'png' ? 'image/png' : 'image/jpeg';
    const fileExt = format === 'png' ? 'png' : 'jpg';

    setTimeout(() => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = upTargetW;
        canvas.height = upTargetH;
        
        ctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
        
        if(shadow > 0) {
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = shadow;
            ctx.drawImage(img, shadow/2, shadow/2, upTargetW - shadow, upTargetH - shadow);
        } else {
            ctx.drawImage(img, 0, 0, upTargetW, upTargetH);
        }
        
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        if (noiseAmount > 0) {
            const imgData = ctx.getImageData(0, 0, upTargetW, upTargetH);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * noiseAmount;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
            }
            ctx.putImageData(imgData, 0, 0);
        }

        const quality = format === 'png' ? 1.0 : 0.98; 

        canvas.toBlob((blob) => {
            if (!blob) { 
                btn.disabled = false;
                btnText.style.display = 'block';
                loader.style.display = 'none';
                return; 
            }

            blob.arrayBuffer().then(buffer => {
                let uint8 = new Uint8Array(buffer);
                
                if (format === 'png') {
                    uint8 = pngDpi(uint8, dpi);
                } else {
                    uint8 = jpgDpi(uint8, dpi); 
                }
                
                const url = URL.createObjectURL(new Blob([uint8], { type: mimeType }));
                const a = document.createElement('a');
                a.href = url;
                
                const originalName = upFile.name;
                const nameWithoutExt = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
                a.download = `${nameWithoutExt}_upscaled_${dpi}dpi.${fileExt}`;
                
                document.body.appendChild(a);
                a.click(); // Download Image ONLY
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                btn.disabled = false;
                btnText.style.display = 'block';
                loader.style.display = 'none';
                toast(`Success! Downloaded at ${upTargetW}x${upTargetH} (${dpi} DPI)`);
            });
        }, mimeType, quality);
    }, 1000);
}

// আলাদা টেক্সট ফাইল ডাউনলোড করার ফাংশন
function downloadMeta() {
    if (!upFile) return;
    
    const title = document.getElementById('upAdobeTitle').value || "Untitled";
    const keywords = document.getElementById('upAdobeKeywords').value || "";
    const metaText = `Title: ${title}\nKeywords: ${keywords}`;
    
    const originalName = upFile.name;
    const nameWithoutExt = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
    
    const metaBlob = new Blob([metaText], { type: 'text/plain' });
    const metaUrl = URL.createObjectURL(metaBlob);
    const metaA = document.createElement('a');
    metaA.href = metaUrl;
    metaA.download = `${nameWithoutExt}_metadata.txt`;
    document.body.appendChild(metaA);
    metaA.click();
    document.body.removeChild(metaA);
    URL.revokeObjectURL(metaUrl);
    
    toast('Metadata downloaded successfully!');
}
