<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canvas — Design Studio</title>
<style>
:root{--purple:#8b3dff;--ink:#24212b;--muted:#777481;--line:#e9e7ef;--bg:#f7f6fa;--panel:#fff;--dark:#25232c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:active{transform:scale(.985)}.hidden{display:none!important}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.topbar{height:58px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;z-index:5}.brand{font-size:19px;font-weight:900;letter-spacing:-.8px;display:flex;align-items:center;gap:7px}.brand-mark{width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,#8b3dff,#ed3fba);color:#fff;display:grid;place-items:center;font-size:17px}.top-right{display:flex;align-items:center;gap:7px}.avatar{width:31px;height:31px;border-radius:50%;background:#e8d9ff;color:#6631ba;display:grid;place-items:center;font-weight:800}.btn{border-radius:9px;padding:9px 12px;background:#f0edf5;color:#383341;font-weight:700;font-size:12px}.btn.primary{background:var(--purple);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.iconbtn{width:36px;height:36px;border-radius:9px;background:#f5f3f8;font-size:18px;color:#494452}.page{flex:1;min-height:0;overflow:auto}.home{background:#fff}.hero{padding:24px 17px 20px;background:linear-gradient(135deg,#f3eaff,#fff0f8 55%,#f1f5ff)}.hero h1{font-size:29px;line-height:1.12;letter-spacing:-1.2px;margin:0 0 8px}.hero p{font-size:13px;color:#655d70;margin:0 0 18px}.searchbar{height:48px;background:#fff;border:1px solid #e6deef;border-radius:12px;display:flex;align-items:center;padding:0 13px;gap:9px;box-shadow:0 5px 20px #3b1c6110}.searchbar span{font-size:18px;color:#8b8592}.searchbar input{border:0;outline:0;min-width:0;flex:1;font-size:13px;background:transparent;color:var(--ink)}.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}.quick{background:#fff;border:1px solid #eee8f4;border-radius:12px;min-height:79px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#4b4355;font-size:10px;font-weight:700}.quick .qico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#f0e6ff;color:#7d3ce3;font-size:18px}.section{padding:19px 15px 4px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.section-head h2{font-size:16px;margin:0;letter-spacing:-.3px}.link{color:#7736df;background:transparent;font-weight:750;font-size:11px}.chips{display:flex;gap:8px;overflow:auto;padding:0 0 5px;scrollbar-width:none}.chip{white-space:nowrap;background:#fff;border:1px solid #e7e3ec;border-radius:20px;padding:8px 12px;font-size:11px;color:#575160}.chip.active{background:#eee3ff;border-color:#d9c4ff;color:#6f2bd0}.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.category{border-radius:12px;overflow:hidden;background:#f2edf9;text-align:left;padding:0;border:1px solid #eee8f4}.category .art{aspect-ratio:1.05;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;overflow:hidden}.category .label{padding:9px 8px 10px;font-size:11px;font-weight:750;background:#fff}.recent-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.design-card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;text-align:left}.design-thumb{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:18px;white-space:pre-line;padding:12px}.design-card .meta{padding:9px;font-size:11px;font-weight:700}.bottom{height:60px;flex-shrink:0;display:flex;align-items:stretch;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottom button{background:transparent;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:#85808e}.bottom button span:first-child{font-size:19px}.bottom button.active{color:var(--purple);font-weight:800}
.editor{background:#f2f1f5;display:flex;flex-direction:column;min-height:0}.editorbar{height:52px;display:flex;align-items:center;gap:6px;padding:0 9px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}.editorbar .spacer{flex:1}.editorbar button{background:#f4f2f7;border-radius:8px;padding:8px 10px;font-size:12px}.editorbar .purple{background:var(--purple);color:white;font-weight:800}.editorwork{flex:1;min-height:0;display:flex;flex-direction:column}.canvaszone{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px;background:#e9e8ed}.canvaswrap{width:min(58vw,350px);height:min(100%,525px);aspect-ratio:2/3;background:#fff;box-shadow:0 5px 18px #19151f22;position:relative;touch-action:none}.canvaswrap canvas{display:block;width:100%;height:100%;touch-action:none}.editorpanel{height:224px;flex-shrink:0;background:#fff;border-top:1px solid #dedbe5;display:flex;flex-direction:column;min-height:0}.paneltabs{display:flex;gap:0;overflow:auto;border-bottom:1px solid var(--line);flex-shrink:0;scrollbar-width:none}.paneltabs button{background:#fff;padding:11px 12px 10px;white-space:nowrap;font-size:10px;color:#6c6674;border-bottom:2px solid transparent}.paneltabs button.active{color:var(--purple);font-weight:850;border-bottom-color:var(--purple)}.panelbody{padding:11px 12px;overflow:auto;flex:1}.toolgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tooltile{min-height:63px;border:1px solid #eeeaf2;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;color:#4e4758}.tooltile b{font-size:20px;font-weight:500;color:#7540d0}.templategrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.template{background:#fff;border:1px solid #e7e3ec;border-radius:8px;overflow:hidden;padding:4px;text-align:left}.templateart{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;font-weight:900;font-size:12px;padding:4px}.template small{display:block;padding:5px 1px 2px;font-size:9px;color:#5f5967}.field{display:flex;flex-direction:column;gap:5px;color:#6e6876;font-size:10px;margin-bottom:9px}.field input,.field select,.field textarea{width:100%;border:1px solid #e1dce8;border-radius:8px;padding:9px;background:#fff;color:#26212f;outline-color:#a77aff;font-size:12px}.field input[type=color]{height:36px;padding:3px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.smallbtn{border:1px solid #e4dfea;background:#fff;border-radius:8px;padding:9px 10px;font-size:11px;font-weight:700}.smallbtn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}.hint{font-size:10px;line-height:1.5;color:#898391}.modalback{position:fixed;inset:0;background:#18131f66;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(100%,360px);background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 15px;font-size:17px}.modalfoot{display:flex;gap:8px;margin-top:14px}.modalfoot button{flex:1}.toast{position:fixed;z-index:30;bottom:75px;left:50%;transform:translateX(-50%);background:#29252f;color:#fff;border-radius:10px;padding:11px 15px;font-size:12px;display:none;white-space:nowrap}
@media(min-width:800px){.app{max-width:1200px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}.hero{padding:35px 30px}.hero h1{font-size:36px}.section{padding-left:30px;padding-right:30px}.category-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.recent-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.editorwork{flex-direction:row}.canvaszone{flex:1}.editorpanel{height:auto;width:350px;border-top:0;border-left:1px solid #dedbe5}.canvaswrap{height:min(90%,700px);width:auto}.paneltabs{flex-wrap:wrap}.paneltabs button{padding:11px 8px}}
</style></head>
<body>
<div class="app">
<header class="topbar">
 <button class="brand" id="brandHome" style="background:transparent;padding:0"><span class="brand-mark">✦</span><span>canvas</span></button>
 <div class="top-right"><button class="iconbtn" id="topSearch" aria-label="Search">⌕</button><button class="btn ghost" id="signIn">Log in</button><button class="btn primary" id="signUp">Sign up</button><div class="avatar hidden" id="avatar">C</div></div>
</header>
<main class="page home" id="homePage">
 <div class="hero"><h1>What will you<br>design today?</h1><p>Bring your ideas to life with Canvas Studio.</p>
  <label class="searchbar"><span>⌕</span><input id="homeSearch" placeholder="Search templates, designs and more"></label>
  <div class="quick-actions">
   <button class="quick" data-create="2:3"><span class="qico">▯</span>Custom size</button>
   <button class="quick" data-create="1:1"><span class="qico">▦</span>Square post</button>
   <button class="quick" data-create="16:9"><span class="qico">▷</span>Presentation</button>
   <button class="quick" id="uploadHome"><span class="qico">⇧</span>Upload</button>
  </div>
 </div>
 <section class="section"><div class="section-head"><h2>Explore categories</h2><button class="link" id="allCategories">See all</button></div>
  <div class="chips" id="categoryChips"><button class="chip active" data-filter="All">For you</button><button class="chip" data-filter="Social">Social media</button><button class="chip" data-filter="Print">Print products</button><button class="chip" data-filter="Business">Business</button><button class="chip" data-filter="Education">Education</button></div>
  <div class="category-grid" id="categoryGrid"></div>
 </section>
 <section class="section"><div class="section-head"><h2>Start with a template</h2><button class="link" id="viewTemplates">View all</button></div><div class="recent-grid" id="homeTemplates"></div></section>
 <section class="section" style="padding-bottom:25px"><div class="section-head"><h2>Your recent designs</h2><button class="link" id="openProjects">View all</button></div><div class="recent-grid" id="recentGrid"></div></section>
</main>
<main class="page editor hidden" id="editorPage">
 <div class="editorbar"><button id="backHome">‹ Home</button><button id="undo">↶</button><button id="redo">↷</button><button id="editorResize">Resize</button><span class="spacer"></span><button id="saveDesign">Save</button><button class="purple" id="exportDesign">Share ↗</button></div>
 <div class="editorwork">
  <div class="canvaszone" id="canvaszone"><div class="canvaswrap" id="canvaswrap"><canvas id="artCanvas" width="800" height="1200"></canvas></div></div>
  <aside class="editorpanel">
   <div class="paneltabs" id="paneltabs">
    <button class="active" data-panel="Templates">▦ Templates</button><button data-panel="Elements">✣ Elements</button><button data-panel="Text">T Text</button><button data-panel="Gallery">▧ Gallery</button><button data-panel="Brand">◇ Brand</button><button data-panel="Uploads">⇧ Uploads</button><button data-panel="Tools">⚙ Tools</button><button data-panel="Projects">☰ Projects</button><button data-panel="Apps">⊞ Apps</button>
   </div>
   <div class="panelbody" id="panelbody"></div>
  </aside>
 </div>
</main>
<nav class="bottom" id="bottomNav"><button class="active" data-home-tab="Home"><span>⌂</span>Home</button><button data-home-tab="Projects"><span>▦</span>Projects</button><button data-home-tab="Templates"><span>▤</span>Templates</button><button data-home-tab="Brand"><span>◇</span>Brand</button><button data-home-tab="Menu"><span>☰</span>Menu</button></nav>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<div class="toast" id="toast"></div><div id="modalroot"></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const homePage=$('#homePage'),editorPage=$('#editorPage'),canvas=$('#artCanvas'),ctx=canvas.getContext('2d'),canvaswrap=$('#canvaswrap'),panelbody=$('#panelbody'),fileInput=$('#fileInput');
let objects=[],selected=-1,bg='#ffffff',panel='Templates',undoStack=[],redoStack=[],uploads=[],designs=[],currentName='Untitled design',logged=false,drag=null,homeFilter='All';
const palettes=[['#fff1e6','#f97316','#3a1c0b'],['#f5edff','#7c3aed','#291344'],['#e8f7f0','#16845b','#14382b'],['#fff0f6','#ec4899','#51152f'],['#eaf4ff','#1684d6','#102c49'],['#171717','#f5f5f5','#ffffff']];
const templates=[
{name:'Creative Studio',tag:'Business',bg:'#f5edff',accent:'#7c3aed',fg:'#291344',title:'MAKE IT\\nHAPPEN',sub:'Ideas start here',kicker:'THE CREATIVE EDITION'},
{name:'Summer Sale',tag:'Business',bg:'#fff1e6',accent:'#f97316',fg:'#3a1c0b',title:'SUMMER\\nSALE',sub:'Up to 50% off',kicker:'LIMITED OFFER'},
{name:'Daily Mood',tag:'Social',bg:'#fff0f6',accent:'#ec4899',fg:'#51152f',title:'GOOD VIBES\\nONLY',sub:'Make today count',kicker:'A LITTLE REMINDER'},
{name:'Nature Notes',tag:'Education',bg:'#e8f7f0',accent:'#16845b',fg:'#14382b',title:'GROW AT\\nYOUR PACE',sub:'One day at a time',kicker:'TAKE A BREATH'},
{name:'Modern Portfolio',tag:'Business',bg:'#171717',accent:'#d6ff55',fg:'#ffffff',title:'DESIGN\\nWITH INTENT',sub:'Selected works • 2026',kicker:'PORTFOLIO'},
{name:'Event Flyer',tag:'Print',bg:'#eaf4ff',accent:'#1684d6',fg:'#102c49',title:'SAVE THE\\nDATE',sub:'You are invited',kicker:'SPECIAL EVENT'}
];
const categories=[['Social media','▧','#eee2ff','Social'],['Presentations','▤','#e1f3ff','Business'],['Posters','▣','#ffe8d9','Print'],['Logos','✦','#fce3f0','Business'],['Documents','▤','#e3f5e9','Education'],['Videos','▷','#e6e7ff','Social'],['Flyers','▧','#fff1cc','Print'],['Resumes','▤','#dff5f3','Business'],['Whiteboards','▦','#f1e8ff','Education']];
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.style.display='none',1900)}
function saveState(){undoStack.push(JSON.stringify({objects:objects.map(o=>({...o,img:undefined})),bg}));if(undoStack.length>35)undoStack.shift();redoStack=[]}
function cloneObjects(){return objects.map(o=>({...o}))}
function openHome(){editorPage.classList.add('hidden');homePage.classList.remove('hidden');$('#bottomNav').classList.remove('hidden');renderHome()}
function openEditor(name='Untitled design',ratio='2:3'){homePage.classList.add('hidden');editorPage.classList.remove('hidden');$('#bottomNav').classList.add('hidden');currentName=name;objects=[];selected=-1;bg='#fff';const [w,h]=ratio.split(':').map(Number);canvas.width=800;canvas.height=Math.round(800*h/w);applyTemplate(templates[0],false);fitCanvas();setPanel('Templates')}
function fitCanvas(){let zone=$('#canvaszone');if(!zone||editorPage.classList.contains('hidden'))return;let ratio=canvas.width/canvas.height, maxW=Math.max(80,zone.clientWidth-26),maxH=Math.max(100,zone.clientHeight-24),w=Math.min(maxW,maxH*ratio);canvaswrap.style.width=w+'px';canvaswrap.style.height=(w/ratio)+'px';draw()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);objects.forEach((o,i)=>{ctx.save();if(o.type==='text'){ctx.fillStyle=o.color||'#222';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${o.weight||800} ${o.size||70}px ${o.font||'Arial'}`;(o.text||'').split('\n').forEach((line,j)=>ctx.fillText(line,o.x,o.y+j*(o.size||70)*1.12));}else if(o.type==='rect'){ctx.fillStyle=o.color;ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h)}else if(o.type==='circle'){ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill()}else if(o.type==='line'){ctx.strokeStyle=o.color;ctx.lineWidth=o.width||8;ctx.beginPath();ctx.moveTo(o.x-o.w/2,o.y);ctx.lineTo(o.x+o.w/2,o.y);ctx.stroke()}else if(o.type==='image'&&o.img){ctx.drawImage(o.img,o.x-o.w/2,o.y-o.h/2,o.w,o.h)}if(i===selected){ctx.strokeStyle='#8b3dff';ctx.lineWidth=3;ctx.setLineDash([10,7]);ctx.strokeRect(o.x-(o.w||200)/2-7,o.y-(o.h||100)/2-7,(o.w||200)+14,(o.h||100)+14)}ctx.restore()})}
function add(o){saveState();objects.push({id:Math.random().toString(36).slice(2),...o});selected=objects.length-1;draw()}
function addText(text='Your text',size=72,color='#25212b'){add({type:'text',text,x:canvas.width/2,y:canvas.height/2,size,color,w:canvas.width*.75,h:size*1.5});setPanel('Text')}
function addShape(type){let cx=canvas.width/2,cy=canvas.height/2;if(type==='rect')add({type,x:cx,y:cy,w:canvas.width*.55,h:canvas.height*.18,color:'#8b3dff'});if(type==='circle')add({type,x:cx,y:cy,r:canvas.width*.13,w:canvas.width*.26,h:canvas.width*.26,color:'#ec4899'});if(type==='line')add({type,x:cx,y:cy,w:canvas.width*.6,h:8,width:8,color:'#222'});if(type==='star')addText('✦',130,'#ec4899');if(type==='heart')addText('♥',130,'#ec4899');}
function applyTemplate(t,save=true){if(save)saveState();objects=[];bg=t.bg;let w=canvas.width,h=canvas.height;objects.push({type:'rect',x:w/2,y:h*.18,w:w,h:h*.36,color:t.accent});objects.push({type:'text',text:t.kicker,x:w/2,y:h*.09,size:Math.max(18,w*.032),color:'#fff',weight:700,w:w*.8,h:40});objects.push({type:'text',text:t.title.replace(/\\n/g,'\n'),x:w/2,y:h*.42,size:Math.min(w*.105,h*.07),color:t.fg,weight:900,w:w*.8,h:h*.18});objects.push({type:'text',text:t.sub,x:w/2,y:h*.61,size:Math.max(24,w*.04),color:t.fg,weight:600,w:w*.8,h:60});objects.push({type:'circle',x:w/2,y:h*.79,r:w*.105,w:w*.21,h:w*.21,color:t.accent});objects.push({type:'text',text:'CREATE  •  INSPIRE  •  SHARE',x:w/2,y:h*.93,size:Math.max(15,w*.025),color:t.fg,weight:700,w:w*.8,h:40});selected=-1;draw()}
function renderHome(){let q=$('#homeSearch').value.toLowerCase();$('#categoryGrid').innerHTML=categories.filter(c=>(homeFilter==='All'||c[3]===homeFilter)&&(!q||c[0].toLowerCase().includes(q))).slice(0,9).map(c=>`<button class="category" data-category="${c[0]}"><div class="art" style="background:${c[2]};color:#6d3cb5">${c[1]}</div><div class="label">${c[0]}</div></button>`).join('');$('#homeTemplates').innerHTML=templates.filter(t=>(homeFilter==='All'||t.tag===homeFilter)&&(!q||(t.name+' '+t.title).toLowerCase().includes(q))).slice(0,4).map((t,i)=>`<button class="design-card" data-template-home="${templates.indexOf(t)}"><div class="design-thumb" style="background:${t.bg};color:${t.fg}"><span style="color:${t.accent};font-size:9px">${t.kicker}</span><br>${t.title.replace(/\\n/g,'\n')}</div><div class="meta">${t.name}</div></button>`).join('');let list=designs.length?designs:[{name:'Welcome design',template:0}];$('#recentGrid').innerHTML=list.slice(-4).reverse().map(d=>{let t=templates[d.template||0];return `<button class="design-card" data-recent="${d.name}"><div class="design-thumb" style="background:${t.bg};color:${t.fg}">${t.title.replace(/\\n/g,'\n')}</div><div class="meta">${d.name}</div></button>`}).join('');$$('[data-template-home]').forEach(b=>b.onclick=()=>{openEditor(templates[+b.dataset.template-home].name);applyTemplate(templates[+b.dataset.template-home],false)});$$('[data-category]').forEach(b=>b.onclick=()=>{homeFilter=b.dataset.category.includes('Poster')||b.dataset.category.includes('Flyer')?'Print':b.dataset.category.includes('Social')?'Social':'All';renderHome();openEditor(b.dataset.category)});$$('[data-recent]').forEach(b=>b.onclick=()=>openEditor(b.dataset.recent))}
function setPanel(p){panel=p;$$('#paneltabs button').forEach(b=>b.classList.toggle('active',b.dataset.panel===p));renderPanel();fitCanvas()}
function renderPanel(){let h='';if(panel==='Templates'){h='<div class="templategrid">'+templates.map((t,i)=>`<button class="template" data-tpl="${i}"><div class="templateart" style="background:${t.bg};color:${t.fg}"><span style="color:${t.accent}">${t.kicker}</span><br>${t.title.replace(/\\n/g,'\n')}</div><small>${t.name}</small></button>`).join('')+'</div><p class="hint">Choose a template to apply it. Then tap text or elements to move them.</p>'}
if(panel==='Elements'){h='<div class="toolgrid">'+[['▰','Rectangle','rect'],['●','Circle','circle'],['╱','Line','line'],['✦','Star','star'],['♥','Heart','heart'],['▧','Photo','photo'],['☘','Leaf','leaf'],['＋','Sticker','sticker']].map(x=>`<button class="tooltile" data-shape="${x[2]}"><b>${x[0]}</b>${x[1]}</button>`).join('')+'</div>'}
if(panel==='Text'){let o=objects[selected]?.type==='text'?objects[selected]:null;h=`<label class="field">Text content<textarea id="textContent" rows="2">${o?o.text:'Your text here'}</textarea></label><div class="row"><label class="field">Font size<input id="fontSize" type="number" min="12" max="180" value="${o?.size||72}"></label><label class="field">Color<input id="fontColor" type="color" value="${o?.color||'#25212b'}"></label></div><div class="row"><button class="smallbtn primary" id="addTextBtn">＋ Add text</button><button class="smallbtn" id="applyTextBtn">Apply to selected</button></div><p class="hint">Tap a text object on the canvas to select it, then change its content or style.</p>`}
if(panel==='Gallery'){h='<div class="toolgrid">'+[['▧','Photos','photo'],['◈','Frames','rect'],['▦','Grids','rect'],['✦','Graphics','star']].map(x=>`<button class="tooltile" data-shape="${x[2]}"><b>${x[0]}</b>${x[1]}</button>`).join('')+'</div><p class="hint">Gallery items are sample elements. Upload your own photos from Uploads.</p>'}
if(panel==='Brand'){h='<div class="section-head"><strong style="font-size:12px">Brand kit</strong><span class="hint">Local preview</span></div><div class="row">'+['#8b3dff','#ec4899','#25212b'].map(c=>`<button class="smallbtn" data-bg="${c}" style="height:42px;background:${c};color:white">${c}</button>`).join('')+'</div><p class="hint">Pick a brand color to set the page background. Brand kits and team assets need a connected service.</p>'}
if(panel==='Uploads'){h='<button class="smallbtn primary" id="uploadBtn" style="width:100%;padding:13px">⇧ Upload images from device</button><p class="hint">Choose one or more photos from your phone gallery.</p><div class="templategrid">'+uploads.map((u,i)=>`<button class="template" data-upload="${i}"><div class="templateart" style="background:#eee"><img src="${u.src}" style="width:100%;height:100%;object-fit:contain"></div><small>${u.name.slice(0,18)}</small></button>`).join('')+'</div>'}
if(panel==='Tools'){h='<div class="toolgrid">'+[['↔','Resize','resize'],['◐','Background','bg'],['⌫','Delete','delete'],['▣','Duplicate','duplicate'],['↶','Undo','undo'],['↷','Redo','redo'],['⇩','Export PNG','export'],['✕','Clear page','clear']].map(x=>`<button class="tooltile" data-action="${x[2]}"><b>${x[0]}</b>${x[1]}</button>`).join('')+'</div><label class="field" style="margin-top:10px">Background color<input id="panelBg" type="color" value="${bg}"></label>'}
if(panel==='Projects'){h='<div class="section-head"><strong style="font-size:12px">Your designs</strong><button class="link" id="newProject">＋ New design</button></div><p class="hint">Designs are kept in this page session. Export PNG to save a permanent copy.</p><div class="templategrid">'+(designs.length?designs:[{name:'Untitled design',template:0}]).map((d,i)=>{let t=templates[d.template||0];return `<button class="template" data-project="${i}"><div class="templateart" style="background:${t.bg};color:${t.fg}">${t.title.replace(/\\n/g,'\n')}</div><small>${d.name}</small></button>`}).join('')+'</div>'}
if(panel==='Apps'){h='<div class="toolgrid">'+[['QR','QR code'],['▧','Mockups'],['✧','AI image'],['▤','Charts'],['♫','Audio'],['▶','Video'],['✦','Magic tools'],['＋','More apps']].map(x=>`<button class="tooltile" data-app="${x[1]}"><b>${x[0]}</b>${x[1]}</button>`).join('')+'</div><p class="hint">These are interface previews. Online AI, QR and video services are not connected in this standalone HTML.</p>'}
panelbody.innerHTML=h;
$$('[data-tpl]').forEach(b=>b.onclick=()=>{applyTemplate(templates[+b.dataset.tpl]);toast('Template applied')});
$$('[data-shape]').forEach(b=>b.onclick=()=>{let s=b.dataset.shape;if(s==='photo'){fileInput.click();return}if(['rect','circle','line'].includes(s))addShape(s);else if(s==='sticker'||s==='star'||s==='heart')addShape(s);else addText('✦',100,'#ec4899')});
if($('#addTextBtn'))$('#addTextBtn').onclick=()=>addText($('#textContent').value||'Your text',+$('#fontSize').value,$('#fontColor').value);
if($('#applyTextBtn'))$('#applyTextBtn').onclick=()=>{if(selected<0||objects[selected].type!=='text')return toast('Select a text item first');saveState();objects[selected].text=$('#textContent').value;objects[selected].size=+$('#fontSize').value;objects[selected].color=$('#fontColor').value;draw();toast('Text updated')};
if($('#uploadBtn'))$('#uploadBtn').onclick=()=>fileInput.click();
$$('[data-upload]').forEach(b=>b.onclick=()=>placeImage(uploads[+b.dataset.upload]));
$$('[data-bg]').forEach(b=>b.onclick=()=>{saveState();bg=b.dataset.bg;draw()});
if($('#panelBg'))$('#panelBg').oninput=e=>{bg=e.target.value;draw()};
$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
if($('#newProject'))$('#newProject').onclick=()=>openEditor('Untitled design','2:3');
$$('[data-project]').forEach(b=>b.onclick=()=>{let d=designs[+b.dataset.project];openEditor(d?.name||'Untitled design')});
$$('[data-app]').forEach(b=>b.onclick=()=>toast(b.dataset.app+' preview only'));
}
function action(a){if(a==='resize')showResize();if(a==='bg')setPanel('Brand');if(a==='delete')deleteSelected();if(a==='duplicate'){if(selected<0)return toast('Select an item first');saveState();objects.push({...objects[selected],id:Math.random().toString(36).slice(2),x:objects[selected].x+25,y:objects[selected].y+25});selected=objects.length-1;draw()}if(a==='undo')undo();if(a==='redo')redo();if(a==='export')exportPng();if(a==='clear'){saveState();objects=[];draw();toast('Page cleared')}}
function placeImage(u){if(!u)return;let im=new Image();im.onload=()=>{let ratio=im.width/im.height,w=canvas.width*.58,h=w/ratio;if(h>canvas.height*.55){h=canvas.height*.55;w=h*ratio}add({type:'image',img:im,src:u.src,x:canvas.width/2,y:canvas.height/2,w,h});toast('Image added')};im.src=u.src}
function deleteSelected(){if(selected<0)return toast('Select an item first');saveState();objects.splice(selected,1);selected=-1;draw()}
function undo(){if(!undoStack.length)return toast('Nothing to undo');redoStack.push(JSON.stringify({objects:objects.map(o=>({...o,img:undefined})),bg}));let d=JSON.parse(undoStack.pop());objects=d.objects;bg=d.bg;draw()}
function redo(){if(!redoStack.length)return toast('Nothing to redo');undoStack.push(JSON.stringify({objects:objects.map(o=>({...o,img:undefined})),bg}));let d=JSON.parse(redoStack.pop());objects=d.objects;bg=d.bg;draw()}
function exportPng(){draw();let a=document.createElement('a');a.download=(currentName.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'design')+'.png';a.href=canvas.toDataURL('image/png');a.click();toast('PNG downloaded')}
function saveDesign(){designs.push({name:currentName,template:0});toast('Saved in this session')}
function showResize(){ $('#modalroot').innerHTML=`<div class="modalback" id="modalback"><div class="modal"><h3>Resize design</h3><label class="field">Preset<select id="ratioSelect"><option value="2:3">Portrait 2:3</option><option value="1:1">Square 1:1</option><option value="16:9">Presentation 16:9</option><option value="4:5">Social post 4:5</option><option value="3:2">Landscape 3:2</option></select></label><div class="modalfoot"><button class="smallbtn" id="cancelModal">Cancel</button><button class="smallbtn primary" id="applyResize">Apply size</button></div></div></div>`;$('#cancelModal').onclick=()=>$('#modalroot').innerHTML='';$('#applyResize').onclick=()=>{let [w,h]=($('#ratioSelect').value).split(':').map(Number);canvas.width=800;canvas.height=Math.round(800*h/w);fitCanvas();$('#modalroot').innerHTML='';toast('Canvas resized')}}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function hit(p,o){return Math.abs(p.x-o.x)<(o.w||180)/2+18&&Math.abs(p.y-o.y)<(o.h||100)/2+18}
canvas.addEventListener('pointerdown',e=>{let p=point(e);selected=-1;for(let i=objects.length-1;i>=0;i--)if(hit(p,objects[i])){selected=i;drag={x:p.x,y:p.y,ox:objects[i].x,oy:objects[i].y};canvas.setPointerCapture(e.pointerId);break}draw();if(panel==='Text')renderPanel()});
canvas.addEventListener('pointermove',e=>{if(!drag||selected<0)return;let p=point(e);objects[selected].x=drag.ox+p.x-drag.x;objects[selected].y=drag.oy+p.y-drag.y;draw()});
canvas.addEventListener('pointerup',()=>{if(drag){saveState();drag=null}});canvas.addEventListener('pointercancel',()=>drag=null);
$$('#paneltabs button').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));
$$('[data-create]').forEach(b=>b.onclick=()=>showCreate(b.dataset.create));
function showCreate(ratio='2:3'){$('#modalroot').innerHTML=`<div class="modalback"><div class="modal"><h3>Create a design</h3><label class="field">Design name<input id="designName" value="Untitled design"></label><label class="field">Canvas size<select id="createRatio"><option value="2:3">Portrait 2:3</option><option value="1:1">Square 1:1</option><option value="16:9">Presentation 16:9</option><option value="4:5">Social post 4:5</option><option value="3:2">Landscape 3:2</option></select></label><div class="modalfoot"><button class="smallbtn" id="createCancel">Cancel</button><button class="smallbtn primary" id="createNow">Create design</button></div></div></div>`;$('#createRatio').value=ratio;$('#createCancel').onclick=()=>$('#modalroot').innerHTML='';$('#createNow').onclick=()=>{let n=$('#designName').value||'Untitled design',r=$('#createRatio').value;$('#modalroot').innerHTML='';openEditor(n,r)}}
$('#backHome').onclick=openHome;$('#brandHome').onclick=openHome;$('#undo').onclick=undo;$('#redo').onclick=redo;$('#editorResize').onclick=showResize;$('#exportDesign').onclick=exportPng;$('#saveDesign').onclick=saveDesign;$('#uploadHome').onclick=()=>fileInput.click();fileInput.onchange=()=>{[...fileInput.files].forEach(f=>{let r=new FileReader();r.onload=()=>{uploads.push({name:f.name,src:r.result});if(!editorPage.classList.contains('hidden')){setPanel('Uploads');placeImage(uploads[uploads.length-1])}else{openEditor('Uploaded design');placeImage(uploads[uploads.length-1])}};r.readAsDataURL(f)});fileInput.value=''};
$('#homeSearch').oninput=renderHome;$('#topSearch').onclick=()=>{$('#homeSearch').focus();window.scrollTo({top:0,behavior:'smooth'})};
$$('[data-filter]').forEach(b=>b.onclick=()=>{homeFilter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderHome()});
$('#allCategories').onclick=()=>{homeFilter='All';renderHome();toast('Showing all categories')};$('#viewTemplates').onclick=()=>{openEditor('Template design');setPanel('Templates')};$('#openProjects').onclick=()=>{openEditor('Your projects');setPanel('Projects')};
$$('[data-home-tab]').forEach(b=>b.onclick=()=>{let t=b.dataset.homeTab;$$('[data-home-tab]').forEach(x=>x.classList.toggle('active',x===b));if(t==='Projects'){openEditor('Your projects');setPanel('Projects')}else if(t==='Templates'){openEditor('Choose a template');setPanel('Templates')}else if(t==='Brand'){openEditor('Brand kit');setPanel('Brand')}else if(t==='Menu'){openEditor('More tools');setPanel('Apps')}else openHome()});
$('#signIn').onclick=()=>accountModal('Log in');$('#signUp').onclick=()=>accountModal('Create account');
function accountModal(title){$('#modalroot').innerHTML=`<div class="modalback"><div class="modal"><h3>${title}</h3><label class="field">Email<input type="email" id="emailInput" placeholder="you@example.com"></label><label class="field">Password<input type="password" id="passInput" placeholder="At least 6 characters"></label><p class="hint">Demo interface only. This standalone file does not connect to a real account service.</p><div class="modalfoot"><button class="smallbtn" id="accountCancel">Cancel</button><button class="smallbtn primary" id="accountContinue">Continue</button></div></div></div>`;$('#accountCancel').onclick=()=>$('#modalroot').innerHTML='';$('#accountContinue').onclick=()=>{let e=$('#emailInput').value;if(!e.includes('@'))return toast('Enter a valid email');logged=true;$('#signIn').classList.add('hidden');$('#signUp').classList.add('hidden');$('#avatar').classList.remove('hidden');$('#avatar').textContent=e[0].toUpperCase();$('#modalroot').innerHTML='';toast('Demo profile enabled')}}
renderHome();window.addEventListener('resize',fitCanvas);
</script></body></html>
