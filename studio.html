<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio - MINAMI STOCK</title>
<style>
:root{--bg:#0e0e14;--card:#1b1b25;--ln:#2a2a38;--pu:#7c3aed;--mu:#9a9ab0}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#e8e8f0;font-family:system-ui,Arial,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
body{background:#0d0f14}

#sb{position:fixed;right:0;top:60px;bottom:0;width:54px;background:#120e26;display:flex;flex-direction:column;align-items:center;gap:13px;padding:12px 0;z-index:5;color:#d8d8e8}
#sb a,#sb button{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;font-size:9.5px;transition:0.2s;}
#sb a:hover,#sb button:hover{color:#fff;}
#sb .ic{font-size:17px;line-height:1}
#sb .cr{width:34px;height:34px;border-radius:50%;background:#8b3dff;display:grid;place-items:center;font-size:22px}
#sb .sp{flex:1}
#av{width:28px;height:28px;border-radius:50%;background:#3a3a4a;display:grid;place-items:center;font-size:12px;overflow:hidden}
#cm{display:none;position:fixed;right:60px;top:120px;background:#1c1f26;border:1px solid #ffffff1a;border-radius:12px;padding:6px;z-index:6;box-shadow:0 10px 30px #000a}
#cm div{padding:9px 14px;font-size:13px;border-radius:8px;cursor:pointer}
#cm div:hover{background:#2a2e38}
#mn{margin-right:54px;margin-top:60px;min-height:calc(100vh - 60px)}
.hero{background:linear-gradient(135deg,#dc2626 0%,#7f1d1d 35%,#1a0505 70%,#000000 100%);border-top-right-radius:14px;padding:50px 14px 22px;text-align:center;position:relative}
.try{position:absolute;right:12px;top:12px;background:#0b0b10;border:1px solid #ffffff30;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600}
.hu{display:flex;flex-direction:column;align-items:center;gap:3px;max-width:420px;margin:0 auto 14px;padding:12px 14px;border:2px dashed #ffffff88;border-radius:14px;background:#00000055;cursor:pointer}
.hu b{font-size:15px}.hu small{font-size:11px;color:#fecaca}
.hu.on{border-color:#fff;background:#ef444466}
.hero h1{font-size:28px;font-weight:700;background:linear-gradient(90deg,#ffffff,#fecaca 60%,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.tabs span{border:1px solid #ffffff40;border-radius:16px;padding:4px 12px;font-size:12px;background:#ffffff14;cursor:pointer}
.sr{display:flex;align-items:center;gap:8px;padding:0 12px;border:2px solid #ef4444;border-radius:12px;background:#0a0505;box-shadow:0 0 16px #ef444466}
.sr input{flex:1;background:none;border:0;color:#fff;padding:12px 0;font-size:13px;outline:0}
.cats{display:flex;gap:14px;overflow-x:auto;padding:16px 14px;scrollbar-width:none;border-bottom:1px solid #1f2229}

.cat{flex:none;width:66px;text-align:center;font-size:10.5px;color:#cfd0dc;cursor:pointer;transition:0.2s;position:relative;}
.cat i{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;margin:0 auto 6px;font-style:normal;font-size:19px;color:#fff;transition:0.2s;}
.cat:hover{color:#fff;}
.cat.active{color:#fff;font-weight:700;}
.cat.active i{transform:scale(1.1);box-shadow:0 0 15px rgba(255,255,255,0.4);}

h2{font-size:17px;padding:20px 14px 10px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:12px;font-weight:600;color:#c9cad6;cursor:pointer}
.rw{position:relative}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none;scroll-behavior:smooth}
.arr{position:absolute;right:8px;top:50%;transform:translateY(-60%);width:34px;height:34px;border-radius:50%;background:#1c1f26;border:1px solid #ffffff30;display:grid;place-items:center;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;padding:0 14px 10px}
.tc{background:#1c1f26;border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.row .tc{flex:none;width:136px}
.th{height:110px;display:grid;place-items:center;background:#262a33;padding:8px;position:relative}
.row .th{height:136px}
.th canvas{box-shadow:0 2px 8px #0006}
.ov{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.ov b{width:22px;height:22px;border-radius:6px;background:#0d0f14cc;display:grid;place-items:center;font-size:12px}
.tc .nm{font-size:11.5px;font-weight:600;padding:8px 8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .mt{font-size:10px;color:#8e91a3;padding:0 8px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:#7c5cff;margin-right:5px;vertical-align:-1px}
.bgrid{display:grid;grid-template-rows:repeat(2,58px);grid-auto-flow:column;grid-auto-columns:158px;gap:10px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
.bc{border-radius:10px;padding:0 12px;display:flex;align-items:center;font-size:12px;font-weight:600;color:#222;position:relative;overflow:hidden;cursor:pointer}
.bc canvas{position:absolute;right:-6px;bottom:-10px;width:46px;transform:rotate(10deg);box-shadow:0 2px 6px #0004}
.sm{display:block;margin:6px auto 0;border:1px solid #ffffff55;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600}
.em{color:#8e91a3;font-size:13px;padding:0 14px}
#cd{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;z-index:30;background:#000000aa}
#cd .pnl{position:absolute;left:0;right:0;bottom:0;top:28%;background:#171a21;border-radius:16px 16px 0 0;display:flex;overflow:hidden}
#cd .lc{width:116px;flex:none;padding:16px 8px;overflow-y:auto}
#cd .lc h3{font-size:17px;font-weight:600;padding:0 6px 14px;line-height:1.2}
.cmi{display:flex;align-items:center;gap:8px;width:100%;padding:8px 6px;border-radius:8px;font-size:11.5px;text-align:left;margin-bottom:4px;color:#e8e8f0}
.cmi i{flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff}
.cmi.on{background:#2d2b52}
#cd .rc{flex:1;min-width:0;padding:16px 12px 16px 6px;overflow-y:auto}
.cds{display:flex;align-items:center;gap:8px;border:1px solid #5b4bb7;border-radius:8px;padding:0 10px;margin-bottom:6px}
.cds input{flex:1;background:none;border:0;color:#fff;padding:10px 0;font-size:12.5px;outline:0}
#cd h4{font-size:14px;font-weight:600;margin:16px 0 10px}
.cr2{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.dc{flex:none;width:150px;cursor:pointer;font-size:11px;color:#c9cad6}
.dc .dh{height:100px;background:#2a2e38;border-radius:10px;display:grid;place-items:center;margin-bottom:7px}
.cdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.cdg .dc{width:auto}
.qa{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.qa a{flex:none;width:62px;text-align:center;font-size:10px;color:#c9cad6}
.qa i{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;margin:0 auto 6px;font-style:normal;font-size:18px;color:#fff}
.cf{display:flex;flex-direction:column;gap:10px;font-size:13px}
.cf input{background:#262a33;border:0;color:#fff;border-radius:8px;padding:9px;width:110px;font:inherit}
#hp{position:fixed;left:12px;bottom:12px;width:36px;height:36px;border-radius:50%;background:#7c3aed;font-weight:700;z-index:4}
.ib{padding:7px 12px;border-radius:8px;background:#262634;font-size:13px;white-space:nowrap}
.ib.p{background:var(--pu)}
#ed{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;background:#1a1a22;flex-direction:column;z-index:10}
.tb{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#12121a;border-bottom:1px solid var(--ln);overflow-x:auto}
.tb input{background:#262634;border:0;color:#fff;border-radius:8px;padding:7px 10px;min-width:120px;font-size:13px}
#wrap{flex:1;position:relative;overflow:hidden;touch-action:none}
#st{position:absolute;transform-origin:0 0;box-shadow:0 8px 40px #000a}
.el{position:absolute;user-select:none;touch-action:none;cursor:move}
.el.sel{outline:2px solid #8b5cf6}
.hd{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;border-radius:50%;background:#8b5cf6;border:2px solid #fff;display:none}
.sel .hd{display:block}
#pn{background:#12121a;border-top:1px solid var(--ln);padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-height:34vh;overflow:auto}
#pn textarea,#pn select,#pn input[type=number]{background:#262634;border:0;color:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
#pn textarea{width:100%}
.lb{font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center}
#tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#tt.on{opacity:1}

/* =========================================
   আপনার দেওয়া ৭০০ টেমপ্লেটের CSS
   ========================================= */
.tpl {
    width: 100%; height: 100%; position: relative; overflow: hidden;
    container-type: inline-size; display: flex; flex-direction: column; background: #fff;
    border-radius: 12px;
}
.tpl-number {
    position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.8); color: #fff;
    padding: 2px 6px; font-size: 10px; border-radius: 4px; z-index: 100; font-weight: bold;
    backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2);
}
.img-box { width: 100%; flex: 1; overflow: hidden; position: relative; z-index: 1; background: #cbd5e1; }
.img-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

/* কর্পোরেট (১-১৫) */
.lay-b1 { display: flex; flex-direction: row; }
.lay-b1 .left { width: 50%; padding: 5cqw; display: flex; flex-direction: column; justify-content: center; }
.lay-b1 .right { width: 50%; position: relative; }
.lay-b1 .title { font-family: 'Space Grotesk', sans-serif; font-size: 9cqw; font-weight: 700; line-height: 1; margin-bottom: 3cqw; }
.lay-b1 .text { font-size: 2.2cqw; line-height: 1.5; }
.lay-b1 .right img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }

.lay-b2 { padding: 5cqw; display: flex; flex-direction: column; }
.lay-b2 .header { font-family: 'Inter', sans-serif; font-size: 3cqw; font-weight: 600; margin-bottom: 4cqw; }
.lay-b2 .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; height: 45cqw; margin-bottom: 4cqw; }
.lay-b2 .title { font-family: 'Space Grotesk', sans-serif; font-size: 10cqw; font-weight: 700; margin-bottom: 3cqw; }
.lay-b2 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; }

.lay-b3 { position: relative; justify-content: flex-end; }
.lay-b3 .bg { position: absolute; inset: 0; z-index: 1; }
.lay-b3 .bg::after { content:''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); }
.lay-b3 .content { position: relative; z-index: 2; padding: 6cqw; color: #fff; }
.lay-b3 .badge { background: #3b82f6; color: #fff; font-size: 2.5cqw; padding: 1cqw 3cqw; border-radius: 5cqw; display: inline-block; margin-bottom: 2cqw; font-weight: bold; }
.lay-b3 .title { font-family: 'Syne', sans-serif; font-size: 12cqw; font-weight: 800; line-height: 1; margin-bottom: 2cqw; }
.lay-b3 .text { font-size: 2.2cqw; line-height: 1.5; color: #cbd5e1; }

.lay-b4 { padding: 5cqw; display: flex; flex-direction: column; justify-content: flex-end; }
.lay-b4 .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(2cqw); padding: 4cqw; border-radius: 3cqw; border: 0.3cqw solid rgba(255,255,255,0.2); height: 100%; display: flex; flex-direction: column; }
.lay-b4 .title { font-family: 'Playfair Display', serif; font-size: 9cqw; margin-bottom: 3cqw; }
.lay-b4 .img-box { height: 45cqw; border-radius: 2cqw; margin-bottom: 3cqw; flex: none; }
.lay-b4 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; }

.lay-b5 { padding: 6cqw; display: flex; flex-direction: column; border-left: 1cqw solid #111; }
.lay-b5 .title { font-family: 'Inter', sans-serif; font-size: 9cqw; font-weight: 800; margin-bottom: 4cqw; text-transform: uppercase; }
.lay-b5 .img-box { height: 50cqw; margin-bottom: 4cqw; flex: none; filter: grayscale(100%); }
.lay-b5 .text { font-size: 2.2cqw; line-height: 1.6; column-count: 2; column-gap: 2cqw; text-align: justify; margin-top: auto; }

.lay-b6 { padding: 6cqw; display: flex; flex-direction: column; }
.lay-b6 .header { display: flex; justify-content: space-between; font-size: 2.5cqw; border-bottom: 0.2cqw solid; padding-bottom: 2cqw; margin-bottom: 3cqw; }
.lay-b6 .title { font-family: 'Oswald', sans-serif; font-size: 14cqw; text-transform: uppercase; line-height: 0.9; margin-bottom: 4cqw; }
.lay-b6 .img-box { border: 0.3cqw solid; height: 50cqw; margin-bottom: 4cqw; flex: none; }
.lay-b6 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; }

.lay-b7 { padding: 6cqw; display: flex; flex-direction: column; border-top: 1.5cqw solid; }
.lay-b7 .title { font-family: 'Playfair Display', serif; font-size: 10cqw; margin-bottom: 4cqw; }
.lay-b7 .img-box { border-radius: 3cqw; height: 55cqw; margin-bottom: 4cqw; flex: none; }
.lay-b7 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; font-weight: 600; }

.lay-b8 { padding: 5cqw; border: 1cqw solid; display: flex; flex-direction: column; }
.lay-b8 .title { font-family: 'Bebas Neue', sans-serif; font-size: 16cqw; line-height: 0.9; margin-bottom: 4cqw; }
.lay-b8 .img-box { border: 1cqw solid; height: 50cqw; margin-bottom: 4cqw; flex: none; }
.lay-b8 .text { font-size: 2.5cqw; font-weight: 600; line-height: 1.4; margin-top: auto; }

.lay-b9 { padding: 6cqw; display: flex; flex-direction: column; }
.lay-b9 .title { font-family: 'Space Grotesk', sans-serif; font-size: 8cqw; margin-bottom: 4cqw; }
.lay-b9 .img-box { border: 0.3cqw dashed; height: 50cqw; margin-bottom: 4cqw; flex: none; padding: 1cqw; }
.lay-b9 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; }

.lay-b10 { padding: 6cqw; position: relative; display: flex; flex-direction: column; overflow: hidden; }
.lay-b10::before { content:''; position: absolute; top: -5cqw; right: -5cqw; width: 40cqw; height: 40cqw; border-radius: 50%; z-index: 0; background: rgba(0,0,0,0.1); }
.lay-b10 .title { font-family: 'Syne', sans-serif; font-size: 10cqw; z-index: 1; margin-bottom: 4cqw; }
.lay-b10 .img-box { z-index: 1; height: 50cqw; margin-bottom: 4cqw; flex: none; border-radius: 2cqw; }
.lay-b10 .text { font-size: 2.2cqw; line-height: 1.5; z-index: 1; margin-top: auto; }

.lay-b11 { padding: 4cqw; display: flex; flex-direction: column; }
.lay-b11 .inner { border: 0.3cqw solid; padding: 4cqw; height: 100%; display: flex; flex-direction: column; }
.lay-b11 .title { font-family: 'Cinzel', serif; font-size: 10cqw; text-align: center; margin-bottom: 4cqw; }
.lay-b11 .img-box { border: 0.2cqw solid; height: 50cqw; margin-bottom: 4cqw; flex: none; }
.lay-b11 .text { font-size: 2.2cqw; line-height: 1.5; text-align: center; margin-top: auto; }

.lay-b12 { display: flex; flex-direction: row; }
.lay-b12 .left { width: 55%; padding: 5cqw; display: flex; flex-direction: column; justify-content: center; }
.lay-b12 .right { width: 45%; position: relative; }
.lay-b12 .title { font-family: 'Oswald', sans-serif; font-size: 10cqw; margin-bottom: 3cqw; text-transform: uppercase; }
.lay-b12 .text { font-size: 2.2cqw; line-height: 1.5; }
.lay-b12 .right img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }

.lay-b13 { padding: 6cqw; display: flex; flex-direction: column; }
.lay-b13 .badge { font-size: 2.5cqw; padding: 1.5cqw 3cqw; display: inline-block; align-self: flex-start; margin-bottom: 3cqw; font-weight: bold; }
.lay-b13 .title { font-family: 'Inter', sans-serif; font-size: 8cqw; font-weight: 800; margin-bottom: 4cqw; }
.lay-b13 .img-box { border-radius: 2cqw; height: 50cqw; margin-bottom: 4cqw; flex: none; }
.lay-b13 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; }

.lay-b14 { padding: 6cqw; display: flex; flex-direction: column; }
.lay-b14 .title { font-family: 'Space Grotesk', sans-serif; font-size: 10cqw; margin-bottom: 4cqw; border-bottom: 0.5cqw solid; padding-bottom: 2cqw; }
.lay-b14 .img-box { height: 50cqw; margin-bottom: 4cqw; flex: none; opacity: 0.8; }
.lay-b14 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; }

.lay-b15 { padding: 6cqw; display: flex; flex-direction: column; }
.lay-b15 .title { font-family: 'Playfair Display', serif; font-size: 11cqw; margin-bottom: 4cqw; font-style: italic; }
.lay-b15 .img-box { height: 55cqw; margin-bottom: 4cqw; flex: none; border: 0.5cqw solid; padding: 1cqw; }
.lay-b15 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; }

/* ক্যাটাগরি (১৬-২৫) */
.lay-c1 { padding: 6cqw; display: flex; flex-direction: column; }
.lay-c1 .header { font-family: 'Great Vibes', cursive; font-size: 10cqw; text-align: center; margin-bottom: 2cqw; }
.lay-c1 .img-box { border-radius: 20cqw 20cqw 2cqw 2cqw; height: 45cqw; margin-bottom: 4cqw; flex: none; }
.lay-c1 .title { font-family: 'Playfair Display', serif; font-size: 8cqw; font-weight: 700; margin-bottom: 2cqw; }
.lay-c1 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; }

.lay-c2 { padding: 5cqw; border: 1cqw solid; display: flex; flex-direction: column; }
.lay-c2 .title { font-family: 'Dancing Script', cursive; font-size: 12cqw; margin-bottom: 4cqw; text-align: right; }
.lay-c2 .img-box { border-radius: 2cqw; height: 50cqw; margin-bottom: 4cqw; flex: none; }
.lay-c2 .text { font-size: 2.2cqw; line-height: 1.6; column-count: 2; column-gap: 2cqw; text-align: justify; margin-top: auto; }

.lay-c3 { padding: 6cqw; display: flex; flex-direction: column; position: relative; }
.lay-c3::before { content:''; position: absolute; top: 10cqw; right: 10cqw; width: 30cqw; height: 30cqw; border-radius: 50%; filter: blur(8cqw); opacity: 0.5; background: rgba(0,0,0,0.1); }
.lay-c3 .header { font-family: 'Great Vibes', cursive; font-size: 10cqw; margin-bottom: 4cqw; z-index: 1; }
.lay-c3 .img-box { border-radius: 50%; height: 50cqw; width: 70cqw; margin: 0 auto 4cqw; border: 0.5cqw dashed; z-index: 1; padding: 1cqw; }
.lay-c3 .text { font-size: 2.2cqw; line-height: 1.5; text-align: center; z-index: 1; margin-top: auto; }

.lay-c4 { padding: 6cqw; border: 0.5cqw solid; display: flex; flex-direction: column; }
.lay-c4 .title { font-family: 'Dancing Script', cursive; font-size: 12cqw; margin-bottom: 4cqw; text-align: center; }
.lay-c4 .img-box { border-radius: 2cqw; height: 55cqw; margin-bottom: 4cqw; flex: none; }
.lay-c4 .text { font-size: 2.2cqw; line-height: 1.5; margin-top: auto; }

.lay-c5 { padding: 6cqw; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.lay-c5::after { content:''; position: absolute; bottom: -10cqw; right: -10cqw; width: 50cqw; height: 50cqw; transform: rotate(45deg); z-index: 0; background: rgba(0,0,0,0.1); }
.lay-c5 .title { font-family: 'Bebas Neue', sans-serif; font-size: 16cqw; line-height: 0.9; margin-bottom: 4cqw; z-index: 1; }
.lay-c5 .img-box { border-radius: 2cqw; height: 50cqw; margin-bottom: 4cqw; flex: none; z-index: 1; border: 0.5cqw solid; }

const rot=(c,e,f)=>{c.save();if(e.rot){const x=e.x+e.w/2,y=e.y+e.h/2;c.translate(x,y);c.rotate(e.rot*Math.PI/180);c.translate(-x,-y)}f();c.restore()};
function wrapT(c,t,w){const o=[];t.split('\n').forEach(p=>{let l='';p.split(' ').forEach(wd=>{const s=l?l+' '+wd:wd;if(c.measureText(s).width>w&&l){o.push(l);l=wd}else l=s});o.push(l)});return o}

const im=e=>{
    if(!e._i){
        const img = new Image();
        if(e.src.startsWith('http')) img.crossOrigin = 'Anonymous';
        img.src = e.src;
        e._i = img;
    }
    return e._i;
};

function draw(c,d,s){c.save();c.scale(s,s);c.fillStyle=d.bg;c.fillRect(0,0,d.w,d.h);
 d.els.forEach(e=>rot(c,e,()=>{
  if(e.t=='text'){
   c.font=(e.it?'italic ':'')+(e.b?'bold ':'')+e.fs+'px '+e.ff;c.textBaseline='top';c.textAlign=e.al;c.lineJoin='round';
   let f=e.col;if(e.gr){f=c.createLinearGradient(0,e.y,0,e.y+e.fs*1.2);f.addColorStop(0,e.gr[0]);f.addColorStop(1,e.gr[1])}
   if(e.gl){c.shadowColor=e.gl;c.shadowBlur=e.fs*.25*s}
   const X=e.al=='center'?e.x+e.w/2:e.al=='right'?e.x+e.w:e.x;
   wrapT(c,e.txt,e.w).forEach((l,i)=>{const Y=e.y+i*e.fs*1.2;if(e.sk){c.lineWidth=e.fs*.06;c.strokeStyle=e.sk;c.strokeText(l,X,Y)}c.fillStyle=f;c.fillText(l,X,Y)})}
  else if(e.t=='poly'){c.beginPath();e.pts.forEach((p,i)=>c[i?'lineTo':'moveTo'](e.x+p[0]*e.w,e.y+p[1]*e.h));c.closePath();c.fillStyle=e.fill;c.fill()}
  else if(e.t=='img'){
      const m=im(e);
      if(m.complete) c.drawImage(m,e.x,e.y,e.w,e.h);
      else {
          c.fillStyle='#333';c.fillRect(e.x,e.y,e.w,e.h);
          c.fillStyle='#666';c.font=(e.w*0.1)+'px Arial';c.textAlign='center';c.textBaseline='middle';
          c.fillText('...',e.x+e.w/2,e.y+e.h/2);
      }
  }
  else if(e.t=='ellipse'){c.beginPath();c.ellipse(e.x+e.w/2,e.y+e.h/2,e.w/2,e.h/2,0,0,7);if(e.fill!='none'){c.fillStyle=e.fill;c.fill()}if(e.stroke){c.strokeStyle=e.stroke;c.lineWidth=d.w*.006;c.stroke()}}
  else{if(e.fill!='none'){c.fillStyle=e.fill;c.fillRect(e.x,e.y,e.w,e.h)}if(e.stroke){c.strokeStyle=e.stroke;c.lineWidth=d.w*.006;c.strokeRect(e.x,e.y,e.w,e.h)}}
 }));c.restore()}
function thumb(d,box){const s=Math.min(box/d.w,box/d.h),c=document.createElement('canvas');c.width=Math.max(1,Math.round(d.w*s));c.height=Math.max(1,Math.round(d.h*s));draw(c.getContext('2d'),d,s);return c}

   h+='<select onchange="sP(\'ff\',this.value);pushH()">'+['Arial','Georgia','Impact','Courier New','Trebuchet MS','Verdana','Times New Roman'].map(f=>'<option'+(f==e.ff?' selected':'')+'>'+f+'</option>').join('')+'</select>';
   h+='<button class="ib" onclick="sP(\'b\',E().b?0:1);pushH();pn()">'+(e.b?'Bold ✓':'Bold')+'</button>';

  }

async function save(){
 D.name=$('nm').value||'Untitled Design';D.thumb=thumb(D,240).toDataURL('image/jpeg',.6);D.updated=Date.now();
 if(!D.id)D.id=user&&db?db.collection('designs').doc().id:'l'+Date.now();

 }catch(e){console.error(e);toast('Save failed')}}
function crc32(b){let t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let r=-1;for(let i=0;i<b.length;i++)r=t[(r^b[i])&255]^(r>>>8);return(r^-1)>>>0}
function pngDpi(u,dpi){const m=Math.round(dpi/0.0254),c=new Uint8Array(21),v=new DataView(c.buffer);v.setUint32(0,9);c.set([112,72,89,115],4);v.setUint32(8,m);v.setUint32(12,m);c[16]=1;v.setUint32(17,crc32(c.subarray(4,17)));const o=new Uint8Array(u.length+21);o.set(u.subarray(0,33));o.set(c,33);o.set(u.subarray(33),54);return o}
function jpgDpi(u,d){if(u[2]==255&&u[3]==224&&u[6]==74){u[13]=1;u[14]=d>>8;u[15]=d&255;u[16]=d>>8;u[17]=d&255;return u}const j=new Uint8Array([255,224,0,16,74,70,73,70,0,1,1,1,d>>8,d&255,d>>8,d&255,0,0]),o=new Uint8Array(u.length+18);o.set(u.subarray(0,2));o.set(j,2);o.set(u.subarray(2),20);return o}

 await Promise.all(D.els.filter(e=>e.t=='img').map(e=>{const m=im(e);return m.decode?m.decode().catch(()=>{}):0}));

 c.toBlob(async b=>{if(!b)return toast('Could not export. Try a lower DPI');
  let u=new Uint8Array(await b.arrayBuffer());u=jp?jpgDpi(u,dpi):pngDpi(u,dpi);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type}));a.download=(($('nm').value||'design')+'-'+dpi+'dpi.'+(jp?'jpg':'png'));a.click();

   const p=Math.min(1,2400/Math.max(i.width,i.height)),w=Math.round(i.width*p),h=Math.round(i.height*p);

  i.src=rd.result};rd.readAsDataURL(f)}
