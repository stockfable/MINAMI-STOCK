<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const rep=(k,v)=>k[0]=='_'?undefined:v;
function toast(m){const t=$('tt');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}

/* ---- Firebase ---- */
let user=null,db=null;
try{
  firebase.initializeApp({apiKey:"AIzaSyAzWwbk-Dh1Kzzp9CvNyqC28ToCWXw41Qs",authDomain:"creoverse-stock.firebaseapp.com",projectId:"creoverse-stock",storageBucket:"creoverse-stock.firebasestorage.app",messagingSenderId:"128072247505",appId:"1:128072247505:web:47e58c3a140f4e858bbdf0"});
  db=firebase.firestore();
  firebase.auth().onAuthStateChanged(u=>{user=u;setAcc(u);loadList()});
}catch(e){console.error(e);setAcc(null)}

/* ---- templates ---- */
const SZ={ig:[1080,1080],story:[1080,1920],pres:[1920,1080],poster:[1200,1700],resume:[1240,1754],logo:[800,800],flyer:[1240,1754],card:[1050,600],inv:[1080,1500],doc:[1240,1754]};
const CT=[['ig','Instagram Post','📷','#fda4af'],['story','Your Story','📱','#f0abfc'],['pres','Presentation','📊','#fdba74'],['poster','Poster','🖼️','#c4b5fd'],['resume','Resume','📄','#7dd3fc'],['logo','Logo','✨','#fde047'],['flyer','Flyer','📣','#5eead4'],['card','Business Card','💳','#cbd5e1'],['inv','Invitation','💌','#f9a8d4'],['doc','Document','📝','#a5b4fc']];
const CL=Object.fromEntries(CT.map(x=>[x[0],x[1]]));
const TT={ig:'NEW COLLECTION',story:'YOUR STORY',pres:'Presentation Title',poster:'GRAND EVENT',resume:'YOUR NAME',logo:'BRAND',flyer:'BIG SALE',card:'Your Name',inv:'YOU ARE INVITED',doc:'Document Title'};
const PL=[['#111111','#e3fb2a','#ffffff'],['#1b1464','#ff4d8d','#ffffff'],['#fff4e6','#ff7a00','#222222'],['#0b3d2e','#9be15d','#ffffff'],['#f3e8ff','#7c3aed','#2b1055'],['#fde2e4','#e63946','#1d3557']];
const PN=['Neon','Pop','Warm','Forest','Violet','Rose'],LN=['Bold','Split','Frame','Circle'];
const TX=(x,y,w,h,txt,fs,col,b,al)=>({t:'text',x,y,w,h,txt,fs,col,b,al,ff:'Arial'});
const RC=(x,y,w,h,fill,t)=>({t:t||'rect',x,y,w,h,fill});
const LY=[
 (w,h,p,c)=>[RC(0,h*.62,w,h*.38,p[1]),TX(w*.08,h*.12,w*.84,h*.4,TT[c],w*.1,p[2],1,'left'),TX(w*.08,h*.7,w*.84,h*.2,'Your subtitle goes here',w*.045,'#111111',0,'left')],
 (w,h,p,c)=>[RC(0,0,w*.45,h,p[1]),TX(w*.05,h*.4,w*.36,h*.2,'NEW',w*.07,'#111111',1,'left'),TX(w*.52,h*.3,w*.4,h*.4,TT[c],w*.07,p[2],1,'left')],
 (w,h,p,c)=>[{t:'rect',x:w*.05,y:h*.05,w:w*.9,h:h*.9,fill:'none',stroke:p[1]},TX(w*.12,h*.38,w*.76,h*.24,TT[c],w*.08,p[2],1,'center'),TX(w*.12,h*.68,w*.76,h*.1,'Add your text here',w*.035,p[1],0,'center')],
 (w,h,p,c)=>[RC(w*.2,h*.1,w*.6,w*.6,p[1],'ellipse'),TX(w*.25,h*.1+w*.27,w*.5,h*.1,TT[c],w*.07,'#111111',1,'center'),TX(w*.1,h*.8,w*.8,h*.1,'Your subtitle goes here',w*.04,p[2],0,'center')]
];
function tpl(c,pi,li){const[w,h]=SZ[c];return{cat:c,name:PN[pi]+' '+LN[li]+' '+CL[c],w,h,bg:PL[pi][0],els:LY[li](w,h,PL[pi],c)}}
const ALL=[];for(let k=0;k<24;k++)for(const x of CT)ALL.push([x[0],k%6,k/6|0]);

/* ---- drawing (thumbnails + export) ---- */
const rot=(c,e,f)=>{c.save();if(e.rot){const x=e.x+e.w/2,y=e.y+e.h/2;c.translate(x,y);c.rotate(e.rot*Math.PI/180);c.translate(-x,-y)}f();c.restore()};
function wrapT(c,t,w){const o=[];t.split('\n').forEach(p=>{let l='';p.split(' ').forEach(wd=>{const s=l?l+' '+wd:wd;if(c.measureText(s).width>w&&l){o.push(l);l=wd}else l=s});o.push(l)});return o}
const im=e=>e._i||(e._i=Object.assign(new Image(),{src:e.src}));
function draw(c,d,s){c.save();c.scale(s,s);c.fillStyle=d.bg;c.fillRect(0,0,d.w,d.h);
 d.els.forEach(e=>rot(c,e,()=>{
  if(e.t=='text'){
   c.font=(e.it?'italic ':'')+(e.b?'bold ':'')+e.fs+'px '+e.ff;c.textBaseline='top';c.textAlign=e.al;c.lineJoin='round';
   let f=e.col;if(e.gr){f=c.createLinearGradient(0,e.y,0,e.y+e.fs*1.2);f.addColorStop(0,e.gr[0]);f.addColorStop(1,e.gr[1])}
   if(e.gl){c.shadowColor=e.gl;c.shadowBlur=e.fs*.25*s}
   const X=e.al=='center'?e.x+e.w/2:e.al=='right'?e.x+e.w:e.x;
   wrapT(c,e.txt,e.w).forEach((l,i)=>{const Y=e.y+i*e.fs*1.2;if(e.sk){c.lineWidth=e.fs*.06;c.strokeStyle=e.sk;c.strokeText(l,X,Y)}c.fillStyle=f;c.fillText(l,X,Y)})}
  else if(e.t=='poly'){c.beginPath();e.pts.forEach((p,i)=>c[i?'lineTo':'moveTo'](e.x+p[0]*e.w,e.y+p[1]*e.h));c.closePath();c.fillStyle=e.fill;c.fill()}
  else if(e.t=='img'){const m=im(e);if(m.complete)c.drawImage(m,e.x,e.y,e.w,e.h)}
  else if(e.t=='ellipse'){c.beginPath();c.ellipse(e.x+e.w/2,e.y+e.h/2,e.w/2,e.h/2,0,0,7);if(e.fill!='none'){c.fillStyle=e.fill;c.fill()}if(e.stroke){c.strokeStyle=e.stroke;c.lineWidth=d.w*.006;c.stroke()}}
  else{if(e.fill!='none'){c.fillStyle=e.fill;c.fillRect(e.x,e.y,e.w,e.h)}if(e.stroke){c.strokeStyle=e.stroke;c.lineWidth=d.w*.006;c.strokeRect(e.x,e.y,e.w,e.h)}}
 }));c.restore()}
function thumb(d,box){const s=Math.min(box/d.w,box/d.h),c=document.createElement('canvas');c.width=Math.max(1,Math.round(d.w*s));c.height=Math.max(1,Math.round(d.h*s));draw(c.getContext('2d'),d,s);return c}

/* ---- home ---- */

function ps(n,e){const s=n.style;s.left=e.x+'px';s.top=e.y+'px';s.width=e.w+'px';s.height=e.h+'px';s.transform=e.rot?'rotate('+e.rot+'deg)':'';
 if(e.t=='text'){s.fontSize=e.fs+'px';s.fontWeight=e.b?700:400;s.fontStyle=e.it?'italic':'normal';s.fontFamily=e.ff;s.textAlign=e.al;s.lineHeight='1.2';s.whiteSpace='pre-wrap';
  s.textShadow=e.gl?'0 0 '+e.fs*.25+'px '+e.gl:'none';s.webkitTextStroke=e.sk?e.fs*.06+'px '+e.sk:'0';s.paintOrder='stroke fill';
  if(e.gr){s.background='linear-gradient(180deg,'+e.gr[0]+','+e.gr[1]+')';s.webkitBackgroundClip='text';s.backgroundClip='text';s.color='transparent'}else{s.background='none';s.color=e.col}}
 else if(e.t=='poly'){s.background=e.fill;s.clipPath='polygon('+e.pts.map(p=>p[0]*100+'% '+p[1]*100+'%').join(',')+')'}
 else if(e.t!='img'){s.background=e.fill=='none'?'transparent':e.fill;s.borderRadius=e.t=='ellipse'?'50%':'0';s.border=e.stroke?(D.w*.006)+'px solid '+e.stroke:'0';s.boxSizing='border-box'}}
function rs(){
 const w=$('wrap');S=Math.min((w.clientWidth-24)/D.w,(w.clientHeight-24)/D.h);L0=(w.clientWidth-D.w*S)/2;T0=(w.clientHeight-D.h*S)/2;
 st.style.cssText='overflow:hidden;width:'+D.w+'px;height:'+D.h+'px;background:'+D.bg+';transform:scale('+S+');left:'+L0+'px;top:'+T0+'px';
 st.innerHTML='';
 D.els.forEach((e,i)=>{const n=document.createElement('div');n.className='el'+(i===sel?' sel':'');n.dataset.i=i;ps(n,e);
  if(e.t=='text')n.innerHTML='<span></span>';
  if(e.t=='img')n.innerHTML='<img draggable="false" style="width:100%;height:100%;pointer-events:none">';
  n.insertAdjacentHTML('beforeend','<b class="hd"></b>');
  if(e.t=='text')n.firstChild.textContent=e.txt;
  if(e.t=='img')n.firstChild.src=e.src;
  st.appendChild(n)});
}
function mark(){[...st.children].forEach((n,i)=>n.classList.toggle('sel',i===sel))}
st.addEventListener('pointerdown',ev=>{
 const n=ev.target.closest('.el');
 if(!n){sel=null;mark();pn();return}
 const i=+n.dataset.i,e=D.els[i];sel=i;mark();pn();
 dr={i,rz:ev.target.classList.contains('hd'),sx:ev.clientX,sy:ev.clientY,x:e.x,y:e.y,w:e.w,h:e.h,mv:0};ev.preventDefault()});
addEventListener('pointermove',ev=>{if(!dr)return;const e=D.els[dr.i],dx=(ev.clientX-dr.sx)/S,dy=(ev.clientY-dr.sy)/S;dr.mv=1;
 if(dr.rz){e.w=Math.max(30,dr.w+dx);e.h=Math.max(30,dr.h+dy)}else{e.x=dr.x+dx;e.y=dr.y+dy}
 ps(st.children[dr.i],e)});
addEventListener('pointerup',()=>{if(dr&&dr.mv)pushH();dr=null});

function sP(k,v){const e=E();if(!e)return;e[k]=v;if(k=='col')e.gr=null;const n=st.children[sel];
 if(k=='txt')n.firstChild.textContent=v;else ps(n,e)}
function add(t){
 const w=D.w,h=D.h,dark=D.bg.length==7&&parseInt(D.bg.slice(1),16)<0x888888;
 D.els.push(t=='text'?TX(w*.1,h*.4,w*.8,h*.15,'Add heading',w*.08,dark?'#ffffff':'#111111',1,'center'):RC(w*.3,h*.3,w*.4,w*.4,'#8b5cf6',t));

  if(e.t=='text'){

   h+='<select onchange="sP(\'ff\',this.value);pushH()">'+['Arial','Georgia','Impact','Courier New','Trebuchet MS','Verdana','Times New Roman'].map(f=>'<option'+(f==e.ff?' selected':'')+'>'+f+'</option>').join('')+'</select>';
   h+='<button class="ib" onclick="sP(\'b\',E().b?0:1);pushH();pn()">'+(e.b?'Bold ✓':'Bold')+'</button>';
   h+='<select onchange="sP(\'al\',this.value);pushH()">'+['left','center','right'].map(a=>'<option'+(a==e.al?' selected':'')+'>'+a+'</option>').join('')+'</select>';
  }
  h+='<button class="ib" onclick="ly(1)">Front</button><button class="ib" onclick="ly(-1)">Back</button><button class="ib" onclick="dup()">Duplicate</button><button class="ib" onclick="del()">Delete</button>';

async function save(){

 if(!D.id)D.id=user&&db?db.collection('designs').doc().id:'l'+Date.now();
 const o={id:D.id,uid:user?user.uid:'local',name:D.name,thumb:D.thumb,updated:D.updated,json:JSON.stringify(D,rep)};
 if(o.json.length>900000)return toast('Design too big. Use smaller images');
 try{
  if(user&&db)await db.collection('designs').doc(D.id).set(o);
  else{const a=JSON.parse(localStorage.getItem('ms_d')||'[]').filter(x=>x.id!=D.id);a.push(o);localStorage.setItem('ms_d',JSON.stringify(a))}
  toast(user?'Saved to your account':'Saved on this device. Sign in to save online')
 }catch(e){console.error(e);toast('Save failed')}}
function crc32(b){let t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let r=-1;for(let i=0;i<b.length;i++)r=t[(r^b[i])&255]^(r>>>8);return(r^-1)>>>0}
function pngDpi(u,dpi){const m=Math.round(dpi/0.0254),c=new Uint8Array(21),v=new DataView(c.buffer);v.setUint32(0,9);c.set([112,72,89,115],4);v.setUint32(8,m);v.setUint32(12,m);c[16]=1;v.setUint32(17,crc32(c.subarray(4,17)));const o=new Uint8Array(u.length+21);o.set(u.subarray(0,33));o.set(c,33);o.set(u.subarray(33),54);return o}
function jpgDpi(u,d){if(u[2]==255&&u[3]==224&&u[6]==74){u[13]=1;u[14]=d>>8;u[15]=d&255;u[16]=d>>8;u[17]=d&255;return u}const j=new Uint8Array([255,224,0,16,74,70,73,70,0,1,1,1,d>>8,d&255,d>>8,d&255,0,0]),o=new Uint8Array(u.length+18);o.set(u.subarray(0,2));o.set(j,2);o.set(u.subarray(2),20);return o}
async function dl(){
 const dpi=D.dpi||300,k=dpi/150,W=Math.round(D.w*k),Hh=Math.round(D.h*k);
 if(W*Hh>64e6)return toast('Too large. Choose a lower DPI');
 await Promise.all(D.els.filter(e=>e.t=='img').map(e=>{const m=im(e);return m.decode?m.decode().catch(()=>{}):0}));
 const c=document.createElement('canvas');c.width=W;c.height=Hh;draw(c.getContext('2d'),D,k);
 const jp=D.fmt=='jpg',type=jp?'image/jpeg':'image/png';
 c.toBlob(async b=>{if(!b)return toast('Could not export. Try a lower DPI');
  let u=new Uint8Array(await b.arrayBuffer());u=jp?jpgDpi(u,dpi):pngDpi(u,dpi);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type}));a.download=(($('nm').value||'design')+'-'+dpi+'dpi.'+(jp?'jpg':'png'));a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Downloaded at '+dpi+' DPI ('+W+' x '+Hh+' px)')},type,.95)}
